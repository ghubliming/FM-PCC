ss time:</text><text x="604.0" y="190.0" font-size="9" fill="#555" text-anchor="start" font-family="Helvetica,Arial,sans-serif">the point it projects is</text><text x="604.0" y="202.0" font-size="9" fill="#555" text-anchor="start" font-family="Helvetica,Arial,sans-serif">already close to the</text><text x="604.0" y="214.0" font-size="9" fill="#555" text-anchor="start" font-family="Helvetica,Arial,sans-serif">feasible set.</text><text x="604.0" y="240.0" font-size="9" fill="#a04000" text-anchor="start" font-family="Helvetica,Arial,sans-serif">hollow: endpoint</text><text x="604.0" y="252.0" font-size="9" fill="#a04000" text-anchor="start" font-family="Helvetica,Arial,sans-serif">projection has one</text><text x="604.0" y="264.0" font-size="9" fill="#a04000" text-anchor="start" font-family="Helvetica,Arial,sans-serif">guiding step there</text></svg>