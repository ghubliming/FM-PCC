<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FM-PCC Matrix Explorer</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background: #fff; color: #000; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 360px; background: #f8f8f8; border-right: 2px solid #000; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        h1 { font-size: 18px; border-bottom: 2px solid #000; padding-bottom: 10px; margin: 0; text-transform: uppercase; }
        .control-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
        label { font-size: 11px; font-weight: bold; color: #444; text-transform: uppercase; letter-spacing: 0.5px; }
        select, input { padding: 10px; border: 1px solid #000; width: 100%; box-sizing: border-box; font-family: inherit; background: #fff; }
        .mode-toggle { display: flex; gap: 10px; margin-bottom: 10px; }
        .mode-btn { font-size: 10px; padding: 5px 10px; border: 1px solid #000; cursor: pointer; background: #eee; text-transform: uppercase; font-weight: bold; }
        .mode-btn.active { background: #000; color: #fff; }
        .bulk-actions { display: flex; gap: 10px; margin-bottom: 5px; }
        .bulk-link { font-size: 10px; font-weight: bold; cursor: pointer; text-decoration: underline; color: #666; }
        .checkbox-list { border: 1px solid #000; background: #fff; padding: 10px; max-height: 140px; overflow-y: auto; font-size: 12px; text-align: left !important; }
        .checkbox-item { display: flex !important; align-items: flex-start !important; justify-content: flex-start !important; margin-bottom: 6px !important; text-align: left !important; }
        .checkbox-item input[type="checkbox"] { margin: 2px 8px 0 0 !important; flex-shrink: 0 !important; display: inline-block !important; width: auto !important; }
        .checkbox-item span { text-align: left !important; word-break: break-word !important; }
        .btn-main { padding: 12px; background: #000; color: #fff; border: none; cursor: pointer; font-weight: bold; width: 100%; text-transform: uppercase; }
        .btn-download { padding: 12px; background: #007bff; color: #fff; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; text-transform: uppercase; }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
        .toolbar { padding: 8px 20px; background: #000; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 11px; font-weight: bold; color: #0f0; }
        .content { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 30px; }
        .scorecard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .score-card { border: 1px solid #000; padding: 10px; background: #fff; }
        .score-val { font-size: 20px; font-weight: bold; }
        .score-label { font-size: 10px; color: #666; font-weight: bold; text-transform: uppercase; }
        #plot-area { background: #fff; border: 1px solid #000; padding: 15px; min-height: 500px; text-align: center; overflow-x: auto; }
        .path-section { border-top: 2px solid #000; padding-top: 20px; margin-bottom: 50px; }
        table { border-collapse: collapse; width: 100%; font-size: 11px; table-layout: fixed; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; overflow-wrap: break-word; }
        .p-seg-0 { color: #c62828; font-weight: bold; }
        .p-seg-1 { color: #1565c0; font-weight: bold; }
        .p-seg-2 { color: #2e7d32; font-weight: bold; }
        .p-seg-3 { color: #ef6c00; font-weight: bold; }
        .p-seg-4 { color: #6a1b9a; font-weight: bold; }
        .p-seg-5 { color: #00838f; font-weight: bold; }
        /* U10: paper-style result matrices (candidates x variants). These must NOT inherit
           the global `table-layout: fixed; width: 100%` above — with ~18 variant columns
           fixed layout squeezes every "mean ± sem" cell into an unreadable wrap. */
        .paper-tbl-wrap { overflow: auto; max-height: 560px; border: 1px solid #000; margin-bottom: 26px; }
        .paper-tbl { border-collapse: collapse; table-layout: auto; width: auto; min-width: 100%; font-size: 10px; }
        .paper-tbl th, .paper-tbl td { border: 1px solid #ccc; padding: 4px 7px; text-align: right; white-space: nowrap; overflow-wrap: normal; }
        .paper-tbl thead th { position: sticky; top: 0; background: #ececec; z-index: 2; text-align: center; font-size: 9px; font-weight: bold; }
        .paper-tbl td.rowhead { position: sticky; left: 0; background: #fafafa; text-align: left; font-weight: bold; z-index: 1; }
        .paper-tbl thead th.corner { left: 0; z-index: 3; background: #ececec; text-align: left; }
        .paper-tbl tbody tr:hover td { background: #fffde7; }
        .paper-tbl tbody tr:hover td.rowhead { background: #fff59d; }
        .paper-tbl .nullcell { color: #bbb; text-align: center; }
        .paper-tbl .sem { color: #666; }
        .paper-tbl .flag { color: #c62828; font-size: 9px; font-weight: bold; }
        .tbl-caption { font-size: 12px; font-weight: bold; margin: 16px 0 4px; }
        .tbl-note { font-size: 10px; color: #666; margin-bottom: 6px; }
        /* U11: per-row "download this source folder as .zip" button (Plot Legend + Path Audit Map). */
        .dl-folder { margin-left: 8px; padding: 2px 7px; font-size: 10px; font-weight: bold; border: 1px solid #007bff;
                     background: #eaf3ff; color: #0056b3; cursor: pointer; white-space: nowrap; vertical-align: middle; }
        .dl-folder:hover { background: #007bff; color: #fff; }
        .dl-folder:disabled { opacity: 0.45; cursor: wait; }
    </style>

    <py-config>
        packages = ["pandas", "matplotlib"]
    </py-config>
</head>
<body>

<div class="sidebar">
    <h1>FM-PCC EXPLORER</h1>
    <div class="control-group">
        <label>1. Experiment Batch Source</label>
        <div class="mode-toggle">
            <div id="btn-list" class="mode-btn active" onclick="switchMode('list')">QUICK_LIST</div>
            <div id="btn-path" class="mode-btn" onclick="switchMode('path')">CUSTOM_PATH</div>
        </div>
        <div id="input-list"><select id="batch-select"></select></div>
        <div id="input-path" style="display:none"><input type="text" id="custom-path" placeholder="../analysis_results/batch_v3_.../candidates_multidimensional_aggregated.csv"></div>
    <div class="control-group">
        <label>7. Visual Zoom (Magnify)</label>
        <div style="display:flex; gap:5px;">
            <button class="mode-btn" onclick="adjustZoom(-0.2)" style="flex:1">SMALLER</button>
            <button class="mode-btn" onclick="adjustZoom(0.2)" style="flex:1">LARGER</button>
        </div>
        <div style="text-align:center; font-size:10px; font-weight:bold; margin-top:5px;">
            Scale: <span id="zoom-val">1.0x</span>
            <input type="hidden" id="width-zoom" value="1.0">
        </div>
    </div>
    <div class="control-group">
        <label>8. Matplotlib FigWidth</label>
        <input type="number" id="fig-width" value="10.0" step="1.0" onchange="trigger_plot()">
    </div>
    <button class="btn-main" py-click="load_data">SYNC_SOURCE</button>
        <button class="btn-download" id="download-btn" py-click="download_plot" style="display:none">EXPORT ZIP (PNG + LATEX + LOG)</button>
    </div>
    <div id="controls-panel" style="display:none; flex-direction: column; gap: 20px;">
        <div class="control-group"><label>2. Analysis Mode</label><select id="mode-select" onchange="trigger_plot()"><option value="candidate">By Candidate</option><option value="env">By Environment</option></select></div>
        <div class="control-group"><label>2.5 Seed Mode</label><select id="seed-mode-select" onchange="toggle_seed_mode()"><option value="standard">Standard (Avg All Available)</option><option value="custom">Custom Seed Compare</option></select></div>
        <div class="control-group" id="custom-seed-panel" style="display:none;">
            <label>Select Seeds to Compare</label>
            <div class="checkbox-list" style="display:flex; flex-wrap:wrap; gap:5px;">
                <div class="checkbox-item"><input type="checkbox" class="seed-check" value="6" checked onchange="trigger_plot()"><span>6</span></div>
                <div class="checkbox-item"><input type="checkbox" class="seed-check" value="7" checked onchange="trigger_plot()"><span>7</span></div>
                <div class="checkbox-item"><input type="checkbox" class="seed-check" value="8" checked onchange="trigger_plot()"><span>8</span></div>
                <div class="checkbox-item"><input type="checkbox" class="seed-check" value="9" checked onchange="trigger_plot()"><span>9</span></div>
                <div class="checkbox-item"><input type="checkbox" class="seed-check" value="10" checked onchange="trigger_plot()"><span>10</span></div>
            </div>
            <div id="seed-error-msg" style="color:red; font-size: 11px; margin-top:5px; font-weight:bold;"></div>
        </div>
        <div class="control-group"><label>3. Metric</label><select id="metric-select" onchange="trigger_plot()"></select></div>
        <div class="control-group"><label>4. Environment Focus</label><select id="env-select" onchange="trigger_plot()"></select></div>
        <div class="control-group"><label>5. Variants</label><div class="bulk-actions"><span class="bulk-link" onclick="bulkSelect('var-check', true)">[ALL]</span><span class="bulk-link" onclick="bulkSelect('var-check', false)">[NONE]</span></div><div id="variant-list" class="checkbox-list"></div></div>
        <div class="control-group"><label>6. Candidates</label><div class="bulk-actions"><span class="bulk-link" onclick="bulkSelect('cand-check', true)">[ALL]</span><span class="bulk-link" onclick="bulkSelect('cand-check', false)">[NONE]</span></div><div id="candidate-list" class="checkbox-list"></div></div>
        <button class="btn-main" style="background:#444;" py-click="trigger_plot">REFRESH_RE_DRAW</button>
    </div>
</div>

<div class="main">
    <div class="toolbar"><div id="engine-status" class="status">ENGINE_READY</div><div>SCIENTIFIC_SUITE_v3.12</div></div>
    <div class="content">
        <div id="scorecard-area" style="display:none"><label>Performance Scorecard</label><div class="scorecard-grid" id="scorecard-container"></div></div>
        <div id="plot-area"><p style="padding-top: 200px; color: #999;">CHOOSE_EXPERIMENT_TO_START</p></div>
        <div class="path-section" id="selection-map-section" style="display:none; border-top: 2px dashed #007bff; margin-bottom: 0;"><label style="color:#007bff;">Plot Legend — Selected Candidates (this plot only)</label><div id="selection-map-container"></div></div>
        <div class="path-section" id="summary-section" style="display:none; border-top: 2px solid #000;"><label>Result Matrices — Selected Candidates &times; All Variants</label><div id="summary-container"></div></div>
        <div class="path-section" id="path-section" style="display:none"><label>Path Audit Map</label><div id="path-map-container"></div></div>
    </div>
</div>

<script type="py">
import pandas as pd
import matplotlib.pyplot as plt
import io, json, re, zipfile, asyncio
from urllib.parse import quote, unquote
from pyscript import display
from js import document, console, fetch, window, Uint8Array, File, URL
from pyodide.ffi import create_proxy

df = None
df_agg = None
df_raw = None
current_fig = None
# U10: bumped on every SYNC_SOURCE so the result-matrix cache invalidates on new data.
data_version = 0

async def init_manifest():
    import re
    try:
        # Fetch the directory listing directly (works with python -m http.server)
        response = await fetch("../analysis_results/")
        if response.ok:
            html = await response.text()
            # Find all links that look like batch_v3_ folders
            batches = re.findall(r'href="(batch_[^/"]+)/?"', html)
            # Remove duplicates and sort descending
            batches = sorted(list(set(batches)), reverse=True)
            
            if len(batches) > 0:
                options = "".join([f'<option value="{b}">{b}</option>' for b in batches])
                document.getElementById("batch-select").innerHTML = options
                document.getElementById("engine-status").innerHTML = "ENGINE_READY"
                document.getElementById("engine-status").style.color = "#0f0"
            else:
                document.getElementById("engine-status").innerHTML = "NO_BATCHES_FOUND"
                document.getElementById("engine-status").style.color = "orange"
        else:
            # Fallback to manifest if directory listing is forbidden
            resp2 = await fetch("../analysis_results/results_manifest.json")
            if resp2.ok:
                data = await resp2.json()
                batches = data.get("batches", [])
                if len(batches) > 0:
                    options = "".join([f'<option value="{b}">{b}</option>' for b in batches])
                    document.getElementById("batch-select").innerHTML = options
                    document.getElementById("engine-status").innerHTML = "ENGINE_READY"
                    document.getElementById("engine-status").style.color = "#0f0"
    except Exception as e:
        console.log(f"[ manifest error ] {e}")
        pass

async def load_data(event=None):
    global df_agg, df_raw, data_version
    mode = window.currentMode
    if mode == "list":
        batch = document.getElementById("batch-select").value
        path_agg = f"../analysis_results/{batch}/candidates_multidimensional_aggregated.csv"
        path_raw = f"../analysis_results/{batch}/candidates_multidimensional_raw.csv"
    else:
        path_agg = document.getElementById("custom-path").value
        path_raw = path_agg.replace("aggregated.csv", "raw.csv")
    
    try:
        console.log(f"[ loader ] Fetching from {path_agg}...")
        document.getElementById("engine-status").innerText = "FETCHING..."
        
        response = await fetch(path_agg)
        if not response.ok:
            raise Exception(f"HTTP {response.status}")
        csv_text = await response.text()
        df_agg = pd.read_csv(io.StringIO(csv_text), low_memory=False)
        # Checkbox values from the DOM are always JS strings (get_checked()), but
        # pandas infers 'Candidate' as int64 for the new numeric-labeled batches
        # (was object/str for the old A/B/C batches). Force str here so .isin()
        # against checked_cands matches either labeling scheme identically —
        # without this, numeric-candidate batches load fine but every plot filters
        # down to an empty dataframe (silently — no error, nothing to redraw).
        df_agg['Candidate'] = df_agg['Candidate'].astype(str)

        # Try fetch raw (silent fail if not found)
        resp_raw = await fetch(path_raw)
        if resp_raw.ok:
            df_raw = pd.read_csv(io.StringIO(await resp_raw.text()), low_memory=False)
            df_raw['Candidate'] = df_raw['Candidate'].astype(str)
        else:
            df_raw = None

        data_version += 1
        document.getElementById("controls-panel").style.display = "flex"
        document.getElementById("download-btn").style.display = "block"
        document.getElementById("path-section").style.display = "block"
        document.getElementById("scorecard-area").style.display = "block"
        populate_dynamic_filters()
        render_path_map()
        await trigger_plot(None)
        document.getElementById("engine-status").innerText = "SYNC_COMPLETE"
    except Exception as e:
        document.getElementById("engine-status").innerText = "LOAD_ERROR"
        console.log(str(e))

def populate_dynamic_filters():
    metrics = sorted(df_agg['metric'].unique())
    # U7 fix: default to a CORE metric, not the alphabetically-first one. Adding the
    # HardFlow-only metrics (activation_threshold, batch_size, ...) made 'a...' sort to
    # the top, so the dropdown defaulted to a metric that only hardflow_new npz has —
    # every non-hardflow variant then filtered to an empty subset (blank plot / stuck
    # placeholder). Prefer the headline metric so the initial + typical selection has data.
    default_metric = next((m for m in ["n_success_and_constraints", "n_success", "avg_time"] if m in metrics), metrics[0] if metrics else None)
    document.getElementById("metric-select").innerHTML = "".join([f'<option value="{m}"{" selected" if m == default_metric else ""}>{m.upper()}</option>' for m in metrics])
    envs = sorted(df_agg['halfspace_variant'].unique())
    document.getElementById("env-select").innerHTML = "".join([f'<option value="{e}">{e.upper()}</option>' for e in envs])
    # Do NOT auto-check any box on first load: large batches (many variants x candidates)
    # freeze the page trying to render the full matrix at once. U10 also drops the old
    # "pre-check the first item" behaviour — the plot starts empty on purpose, because the
    # Result Matrices section below now gives the full unfiltered picture without any
    # selection, and an auto-picked CAND_1/first-variant bar was routinely mistaken for a
    # meaningful default. The user checks what they want (or hits [ALL]).
    vars_list = sorted(df_agg['variant'].unique())
    document.getElementById("variant-list").innerHTML = "".join([f'<div class="checkbox-item"><input type="checkbox" class="var-check" value="{v}" onchange="trigger_plot()"> <span>{v}</span></div>' for v in vars_list])
    # numeric-labeled batches (Candidate = "1".."48") must sort as numbers, not
    # lexicographically ("1","10","11",...,"2",...) — alphabetic labels ("A","B",...)
    # are untouched since they never match .isdigit().
    cands_list = sorted(df_agg['Candidate'].unique(), key=lambda c: (0, int(c)) if c.isdigit() else (1, c))
    document.getElementById("candidate-list").innerHTML = "".join([f'<div class="checkbox-item"><input type="checkbox" class="cand-check" value="{c}" onchange="trigger_plot()"> <span>CAND_{c}</span></div>' for c in cands_list])

def show_no_data(metric, checked_vars, checked_cands, env):
    # U7 fix: never leave the "CHOOSE_EXPERIMENT_TO_START" placeholder (or a silent
    # blank) when a valid-looking selection has no rows — tell the user WHICH facet is
    # empty. Most common cause: a hardflow-only metric (activation_threshold / nlp_solves)
    # selected against non-hardflow variants, or a candidate that lacks the chosen env.
    env_line = f"<br>env = <b>{env}</b>" if env else ""
    msg = (f'<div style="padding:24px;color:#b71c1c;font-family:monospace;font-size:13px;line-height:1.6;">'
           f'<b>NO DATA FOR THIS SELECTION</b><br><br>'
           f'metric = <b>{metric}</b><br>'
           f'variants = {", ".join(checked_vars)}<br>'
           f'candidates = {", ".join("CAND_"+c for c in checked_cands)}{env_line}<br><br>'
           f'Tip: hardflow-only metrics (activation_threshold, nlp_solves, nfe, batch_size, '
           f'flow_steps) exist only for <b>hardflow_new*</b> variants. Pick a core metric '
           f'(n_success_and_constraints, avg_time) to compare across all variants.</div>')
    document.getElementById("plot-area").innerHTML = msg

def show_empty_selection(checked_vars, checked_cands):
    # U10: with nothing pre-checked, an un-drawn plot is the normal start state — say so
    # explicitly instead of leaving the stale "CHOOSE_EXPERIMENT_TO_START" placeholder (or a
    # previous plot) sitting there, and point at the matrices that ARE already populated.
    missing = []
    if not checked_vars: missing.append("variant")
    if not checked_cands: missing.append("candidate")
    document.getElementById("plot-area").innerHTML = (
        '<div style="padding:60px 24px;color:#666;font-family:monospace;font-size:13px;line-height:1.7;">'
        f'<b style="color:#000;font-size:15px;">NO PLOT — SELECT AT LEAST ONE {" AND ONE ".join(m.upper() for m in missing)}</b><br><br>'
        'Sidebar &rarr; <b>5. Variants</b> and <b>6. Candidates</b> (use <b>[ALL]</b> for everything).<br>'
        'Nothing is pre-checked by design.<br><br>'
        'The <b>Result Matrices</b> below only need <b>candidates</b> &mdash; tick those alone and '
        'they (and the LaTeX export) fill in with every variant as a column.</div>')
    document.getElementById("scorecard-container").innerHTML = (
        '<div class="score-card" style="grid-column: span 4; text-align:center; color:#999;">'
        'No selection &mdash; scorecard idle</div>')
    document.getElementById("selection-map-section").style.display = "none"

async def trigger_plot(event=None):
    global df_agg, df_raw, current_fig
    if df_agg is None: return
    metric, mode, env = document.getElementById("metric-select").value, document.getElementById("mode-select").value, document.getElementById("env-select").value
    checked_vars, checked_cands = get_checked("var-check"), get_checked("cand-check")

    # U10: the Result Matrices ignore the VARIANT checkboxes (all variants are always
    # columns) and only follow the candidate ones, so they are rendered BEFORE the
    # early-return below — with candidates but no variants ticked the plot can't draw, yet
    # the matrices are perfectly well defined.
    render_summary_tables()

    if not checked_vars or not checked_cands or not metric:
        plt.close('all')
        current_fig = None
        show_empty_selection(checked_vars, checked_cands)
        return

    seed_mode = document.getElementById("seed-mode-select").value
    document.getElementById("seed-error-msg").innerText = ""
    x_axis = 'Candidate' if mode == "candidate" else 'halfspace_variant'
    
    if seed_mode == "custom" and df_raw is not None:
        checked_seeds = [int(x) for x in get_checked("seed-check")]
        if not checked_seeds:
            document.getElementById("seed-error-msg").innerText = "Select >= 1 seed."
            return
            
        mask = (df_raw['metric'] == metric) & (df_raw['variant'].isin(checked_vars)) & (df_raw['Candidate'].isin(checked_cands)) & (df_raw['seed'].isin(checked_seeds))
        if mode == "candidate": mask &= (df_raw['halfspace_variant'] == env)
        subset = df_raw[mask]
        
        # U7 fix: WARN about candidates missing a selected seed, but do NOT abort the
        # whole plot (that wiped everything the moment a partial-seed candidate — e.g.
        # a seed-6-only hardflow run — was included). Plot whatever seeds exist; the
        # groupby mean below just uses the available rows per candidate.
        warn = []
        for cand in checked_cands:
            cand_subset = subset[subset['Candidate'] == cand]
            found = set(cand_subset['seed'].unique())
            missing = set(checked_seeds) - found
            if missing:
                warn.append(f"CAND_{cand}: {sorted(missing)}")
        if warn:
            document.getElementById("seed-error-msg").innerText = "Note: plotting available seeds only — missing " + "; ".join(warn)
        if subset.empty:
            plt.close('all')
            show_no_data(metric, checked_vars, checked_cands, env if mode == "candidate" else None)
            return

        pivot_mean = subset.groupby([x_axis, 'variant'])['value'].mean().unstack()
        pivot_std = subset.groupby([x_axis, 'variant'])['value'].std().unstack() if len(checked_seeds) > 1 else None
        active_subset = subset
    else:
        mask = (df_agg['metric'] == metric) & (df_agg['variant'].isin(checked_vars)) & (df_agg['Candidate'].isin(checked_cands))
        if mode == "candidate": mask &= (df_agg['halfspace_variant'] == env)
        subset = df_agg[mask]
        if subset.empty:
            show_no_data(metric, checked_vars, checked_cands, env if mode == "candidate" else None)
            return
        val_col = 'mean' if 'mean' in df_agg.columns else 'value'
        pivot_mean = subset.groupby([x_axis, 'variant'])[val_col].mean().unstack()
        pivot_std = subset.groupby([x_axis, 'variant'])['std'].mean().unstack() if 'std' in df_agg.columns else None
        active_subset = subset

    # U12: reindex instead of filtering. A selected variant with no rows at all used to be
    # dropped from the frame entirely, so it vanished from the plot AND from the legend —
    # indistinguishable from "not selected". Reindexing keeps it as an ALL-NaN column, which
    # gets an x-slot and an explicit n/a mark below. Same for a selected candidate that never
    # ran in this environment (candidate mode only; in environment mode the x-axis is
    # whatever environments exist, there is no user-supplied list to reindex against).
    pivot_mean = pivot_mean.reindex(columns=list(checked_vars))
    if pivot_std is not None: pivot_std = pivot_std.reindex(columns=list(checked_vars))
    if x_axis == 'Candidate':
        pivot_mean = pivot_mean.reindex(index=[c for c in checked_cands])
        if pivot_std is not None: pivot_std = pivot_std.reindex(index=[c for c in checked_cands])
    
    try:
        calc_width = float(document.getElementById("fig-width").value)
    except:
        calc_width = 10.0
    
    plt.close('all')
    fig, ax = plt.subplots(figsize=(calc_width, 6))
    pivot_mean.plot(kind='bar', ax=ax, width=0.8, edgecolor='black', colormap='tab10', alpha=0.9, yerr=pivot_std, capsize=4)

    # U8: print the exact value directly above each bar. Annotate manually instead of
    # ax.bar_label — bar_label auto-couples to the ErrorbarContainer that yerr adds, and
    # when a selected variant/candidate combo doesn't exist its bar is NaN with a
    # degenerate (1-D) error array, so bar_label crashes in err[:, 1] (IndexError).
    # Manual annotation reads only the bar height and skips NaN bars, so it never touches
    # the error data. Extra top margin keeps the rotated labels on-canvas.
    #
    # U12: a NaN bar and a genuine 0.000 bar are BOTH nothing at the axis line, so the chart
    # was silently equating "this method scored zero" with "this combination was never run".
    # NaN bars are now marked n/a at the baseline, in red, and counted under the axes.
    # pandas' bar plotter runs fillna(0) on the frame before handing it to matplotlib, so a
    # never-run combination arrives here as a REAL 0-height bar — a measured 0.000 and "no
    # data at all" drew the identical mark. The truth is still in pivot_mean, so the mask is
    # read from THERE and paired back onto the rects: one BarContainer per column, one rect
    # per index row, both in frame order. If that pairing ever stops holding (a matplotlib
    # or pandas change), fall back to the rect height and mark nothing rather than mislabel.
    from matplotlib.container import BarContainer
    bars = [c for c in ax.containers if isinstance(c, BarContainer)]
    paired = (len(bars) == len(pivot_mean.columns)
              and all(len(b) == len(pivot_mean.index) for b in bars))
    n_missing = n_bars = 0
    for ci, container in enumerate(bars):
        for ri, rect in enumerate(container):
            n_bars += 1
            h = rect.get_height()
            value = pivot_mean.iat[ri, ci] if paired else h
            xc = rect.get_x() + rect.get_width() / 2.0
            if value != value:  # NaN -> nothing was measured here; say so, do not imply zero
                n_missing += 1
                # height NaN, NOT set_visible(False): an invisible patch makes matplotlib
                # draw an empty swatch for that variant in the legend too, which loses the
                # colour key. A NaN height just isn't drawn, and the legend stays intact.
                rect.set_height(float('nan'))
                ax.annotate("n/a", xy=(xc, 0.0), xytext=(0, 3), textcoords="offset points",
                            ha="center", va="bottom", fontsize=6, rotation=90,
                            color="#b71c1c", fontweight="bold")
                continue
            ax.annotate(f"{h:.3g}", xy=(xc, h),
                        xytext=(0, 3), textcoords="offset points",
                        ha="center", va="bottom", fontsize=7, rotation=90)
    ax.margins(y=0.15)
    if n_missing:
        ax.set_xlabel(f"{n_missing} of {n_bars} bars have NO DATA (marked n/a) - "
                      f"an absent bar is not a zero",
                      fontsize=8, color="#b71c1c", fontweight="bold")

    ax.legend(title="Variant", bbox_to_anchor=(1.05, 1), loc='upper left', fontsize=8)

    ax.grid(True, alpha=0.2, axis='y')
    ax.set_title(f"Dynamic Analysis: {metric.upper()}", fontsize=12, fontweight='bold'); ax.set_ylabel(metric)
    plt.tight_layout()
    current_fig = fig
    area = document.getElementById("plot-area")
    area.innerHTML = ""
    display(fig, target="plot-area")
    
    # Re-apply the Visual Zoom (CSS)
    import asyncio
    await asyncio.sleep(0.1)
    window.applyZoom()

    # Selected-candidates legend, in the exact left-to-right order they appear on the
    # plot's x-axis (pivot_mean.index). Lets the user read each plotted bar-group's ID
    # straight off to its source path without hunting through the full Path Audit Map.
    render_selection_map(pivot_mean.index.tolist(), x_axis, checked_cands)
    update_scorecard(active_subset, metric)

def _download_bytes(payload, filename, mime):
    js_array = Uint8Array.new(payload)
    f = File.new([js_array], filename, { "type": mime })
    url = URL.createObjectURL(f)
    link = document.createElement("a"); link.href = url; link.download = filename; link.click()
    URL.revokeObjectURL(url)

# ---------------------------------------------------------------------------------------
# U11: "download this candidate's SOURCE FOLDER as a .zip", the browser equivalent of
# right-click -> Download on the folder in VS Code.
#
# How it can work at all: the CSV's Full_Path is an ABSOLUTE path on the machine that ran the
# analysis (e.g. /data/home/llim/FMPCC/FM-PCC/logs/...), and the README tells you to serve the
# REPO ROOT over `python3 -m http.server`. So the very same http.server that hands out this
# page also hands out `<repo-root>/logs/...` — we just have to turn the absolute path back
# into a root-relative one, walk the directory listing recursively, and zip the files client
# side. Nothing server-side is added; if the listing isn't reachable we say so instead of
# pretending. Only works when serving from the repo root of the machine holding the runs.
# ---------------------------------------------------------------------------------------
MAX_CRAWL_DEPTH = 8       # runs nest a few levels (seed/ -> rollouts/); 8 is far past that
MAX_CRAWL_FILES = 4000    # runaway guard: a mis-resolved path could point at the whole repo
CONFIRM_FILE_COUNT = 150  # above this, ask first — .npz rollout dumps get big fast
_folder_dl_busy = False

def _esc_attr(s):
    return (str(s).replace("&", "&amp;").replace('"', "&quot;")
                  .replace("<", "&lt;").replace(">", "&gt;"))

def _folder_btn(path, label=""):
    # Rendered into the Source Path cell of both path tables. The path travels in a data-
    # attribute (NOT an inline onclick arg) because real run folders contain characters that
    # break naive JS string quoting — e.g. "fm_visual_avoiding(unfull)" and single quotes.
    p = "" if path is None else str(path).strip()
    if p in ("", "Unknown", "nan", "— path not found —"):
        return ""
    return (f'<button class="dl-folder" data-path="{_esc_attr(p)}" data-cand="{_esc_attr(label)}"'
            f' title="Download this folder as .zip (served by the same host as this page)">'
            f'&#8681; ZIP</button>')

def _rel_path_candidates(full_path):
    # Absolute run path -> ordered guesses at the path RELATIVE to the served root, most
    # specific first. The page lives at <root>/Data_Analysis/Visualizer/, so each guess is
    # later probed as "../../<guess>/" and the first one that returns a directory listing wins.
    p = str(full_path).replace("\\", "/").strip()
    segs = [s for s in p.split("/") if s and s != "."]
    outs = []
    for i in range(len(segs) - 1, -1, -1):        # everything after the last repo-root marker
        if segs[i] == "FM-PCC":
            outs.append(segs[i + 1:])
            break
    if "logs" in segs:                            # …/logs/<task>/plans/… (repo-relative by convention)
        outs.append(segs[segs.index("logs"):])
    outs.append(segs)                             # last resort: the whole path, leading / dropped
    seen, uniq = set(), []
    for o in outs:
        key = "/".join(o)
        if key and key not in seen:
            seen.add(key)
            uniq.append(o)
    return uniq

def _enc(segs):
    return "/".join(quote(s) for s in segs)

async def _fetch_listing(url):
    # -> directory-listing HTML, or None if this URL isn't a browsable directory.
    try:
        r = await fetch(url)
    except Exception:
        return None
    if not r.ok:
        return None
    ctype = r.headers.get("content-type") or ""
    if "text/html" not in ctype:
        return None
    text = await r.text()
    # http.server emits <title>Directory listing for /…</title>; requiring it stops a stray
    # index.html (or an SPA fallback) from being mistaken for a directory full of files.
    if "Directory listing" not in text:
        return None
    return text

def _listing_entries(html):
    out = []
    for h in re.findall(r'<a href="([^"]+)"', html):
        if h.startswith(("/", "?", "#", "..", "http://", "https://")):
            continue
        out.append(h)
    return out

async def _crawl_dir(base_url, rel_prefix, depth, files):
    html = await _fetch_listing(base_url)
    if html is None:
        return
    for h in _listing_entries(html):
        name = unquote(h.rstrip("/"))
        if not name or name in (".", ".."):
            continue
        if h.endswith("/"):
            if depth < MAX_CRAWL_DEPTH:
                await _crawl_dir(base_url + h, rel_prefix + name + "/", depth + 1, files)
        else:
            files.append((rel_prefix + name, base_url + h))
        if len(files) >= MAX_CRAWL_FILES:
            return

async def _download_folder(full_path, label):
    global _folder_dl_busy
    status = document.getElementById("engine-status")
    if _folder_dl_busy:
        status.innerText = "FOLDER_ZIP_BUSY"
        return
    _folder_dl_busy = True
    for b in document.getElementsByClassName("dl-folder"):
        b.disabled = True
    try:
        status.innerText = "RESOLVING FOLDER..."
        root_url, segs_used = None, None
        for segs in _rel_path_candidates(full_path):
            url = "../../" + _enc(segs) + "/"
            if await _fetch_listing(url) is not None:
                root_url, segs_used = url, segs
                break
        if root_url is None:
            status.innerText = "FOLDER_NOT_SERVED"
            window.alert(
                "Could not reach this folder over HTTP:\n\n" + str(full_path) +
                "\n\nThe folder is only downloadable when this page is served with "
                "`python3 -m http.server` FROM THE REPO ROOT of the machine that holds the runs "
                "(directory listing enabled). Viewing a cluster-generated CSV from a machine "
                "without those log folders cannot work.")
            return

        status.innerText = "SCANNING FOLDER..."
        files = []
        await _crawl_dir(root_url, "", 0, files)
        if not files:
            status.innerText = "FOLDER_EMPTY"
            window.alert("Folder resolved but contains no files:\n\n" + str(full_path))
            return

        folder = segs_used[-1]
        zip_name = (f"CAND_{label}__{folder}.zip" if str(label).strip() else f"{folder}.zip")
        if len(files) > CONFIRM_FILE_COUNT and not window.confirm(
                f"{folder}\n\n{len(files)} files found"
                + (" (crawl limit hit — folder may be even larger)" if len(files) >= MAX_CRAWL_FILES else "")
                + ".\n\nDownload them all as one .zip?\n"
                  "Rollout dumps (.npz / videos) can run to hundreds of MB, and the whole "
                  "archive is built in browser memory."):
            status.innerText = "FOLDER_ZIP_CANCELLED"
            return

        total = 0
        zbuf = io.BytesIO()
        with zipfile.ZipFile(zbuf, "w", zipfile.ZIP_DEFLATED) as z:
            for i, (rel_name, url) in enumerate(files, start=1):
                r = await fetch(url)
                if not r.ok:
                    console.log(f"[ folder zip ] skip HTTP {r.status}: {url}")
                    continue
                data = bytes(Uint8Array.new(await r.arrayBuffer()).to_py())
                total += len(data)
                # Everything nests under the folder name, so unzipping never litters cwd.
                z.writestr(folder + "/" + rel_name, data)
                status.innerText = f"ZIPPING {i}/{len(files)} — {total/1e6:.1f} MB"
                await asyncio.sleep(0)
        _download_bytes(zbuf.getvalue(), zip_name, "application/zip")
        status.innerText = f"FOLDER ZIP: {len(files)} files, {total/1e6:.1f} MB"
    except Exception as e:
        status.innerText = "FOLDER_ZIP_ERROR"
        console.log(f"[ folder zip ] {e}")
        window.alert("Folder download failed:\n\n" + str(e))
    finally:
        _folder_dl_busy = False
        for b in document.getElementsByClassName("dl-folder"):
            b.disabled = False

def download_folder(path, label=""):
    # Sync entry point for the JS click handler — schedules the coroutine so JS never has to
    # deal with (or swallow) an unhandled promise rejection.
    asyncio.ensure_future(_download_folder(str(path), str(label)))

def download_plot(event):
    global current_fig
    if df_agg is None: return

    from datetime import datetime
    now = datetime.now().strftime("%Y%m%d_%H%M")
    stamp = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
    metric = document.getElementById('metric-select').value
    env = document.getElementById('env-select').value
    checked_vars = get_checked("var-check")
    checked_cands = get_checked("cand-check")
    batch_label = document.getElementById("batch-select").value if window.currentMode == "list" else document.getElementById("custom-path").value

    base_name = f"plot_{metric}_{env}_{len(checked_vars)}v_{len(checked_cands)}c_{now}"
    written = []
    # U11: everything goes into ONE .zip instead of firing three separate <a download> clicks.
    # Browsers throttle / prompt on multi-file auto-downloads, and the three pieces (figure,
    # tables, audit log) only make sense together anyway. bundle = [(name_in_zip, bytes)].
    bundle = []

    # 1. PNG — only if a figure is actually on screen. U10.1: the export no longer bails out
    # when there is no plot, because the LaTeX tables below depend on the candidate selection
    # alone and are perfectly exportable with zero variants ticked.
    if current_fig is not None:
        buf = io.BytesIO(); current_fig.savefig(buf, format='png', dpi=300, bbox_inches='tight'); buf.seek(0)
        bundle.append((f"{base_name}.png", buf.read()))
        written.append("PNG")

    # 2. LaTeX — the four Result Matrices, exactly as rendered on the page.
    ctx, err = _summary_context()
    if ctx is not None:
        tex = build_latex(ctx, batch_label, stamp)
        bundle.append((f"{base_name}_tables.tex", tex.encode()))
        written.append("TEX")
    else:
        console.log(f"[ export ] no LaTeX tables: {err}")

    p_col = 'Full_Path' if 'Full_Path' in df_agg.columns else 'Folder_Name'
    path_map = df_agg[['Candidate', p_col]].drop_duplicates().set_index('Candidate')[p_col].to_dict()
    
    metadata = f"AUDIT LOG: {base_name}\n"
    metadata += "="*40 + "\n"
    metadata += f"TIMESTAMP: {stamp}\n"
    metadata += f"BATCH:     {batch_label}\n"
    metadata += f"METRIC:    {metric}\n"
    metadata += f"ENV:       {env}\n\n"
    metadata += f"SELECTED VARIANTS ({len(checked_vars)}):\n"
    metadata += "\n".join([f" - {v}" for v in checked_vars]) + "\n\n"
    metadata += f"SELECTED CANDIDATES ({len(checked_cands)}):\n"
    stamp_map = _stamp_map()
    for c in checked_cands:
        path = path_map.get(c, "Path not found")
        stamp = stamp_map.get(str(c), "")
        metadata += f" - CAND_{c} (Source: {path})\n"
        if stamp:
            metadata += f"     last run: {stamp}\n"

    bundle.append((f"{base_name}.txt", metadata.encode()))
    written.append("TXT")

    zbuf = io.BytesIO()
    with zipfile.ZipFile(zbuf, "w", zipfile.ZIP_DEFLATED) as z:
        for fname, payload in bundle:
            z.writestr(fname, payload)
    _download_bytes(zbuf.getvalue(), f"{base_name}.zip", "application/zip")
    document.getElementById("engine-status").innerText = "EXPORTED ZIP: " + " + ".join(written)

def get_checked(class_name):
    elements = document.getElementsByClassName(class_name)
    return [e.value for e in elements if e.checked]

def update_scorecard(subset, metric):
    if subset is None or subset.empty: return
    val_col = 'mean' if 'mean' in subset.columns else 'value'
    subset_clean = subset.dropna(subset=[val_col])
    if subset_clean.empty:
        document.getElementById("scorecard-container").innerHTML = '<div class="score-card" style="grid-column: span 4;">No valid data</div>'
        return
        
    if 'success' in metric.lower() or 'reward' in metric.lower():
        best_idx = subset_clean[val_col].idxmax()
    else:
        best_idx = subset_clean[val_col].idxmin()
        
    best_row = subset_clean.loc[best_idx]
    best_cand = best_row['Candidate']
    best_var = best_row['variant']
    best_env = best_row['halfspace_variant'] if 'halfspace_variant' in best_row else 'N/A'
    best_val = best_row[val_col]
    
    html = f'<div class="score-card" style="grid-column: span 4; background: #e8f5e9; border: 2px solid #2e7d32; text-align: center; padding: 15px;">'
    html += f'<div class="score-label" style="color: #2e7d32; font-size: 14px;">🏆 OVERALL BEST FOR: {metric.upper()}</div>'
    html += f'<div class="score-val" style="margin-top: 10px; font-size: 16px;">Candidate <strong>{best_cand}</strong> in <strong>{best_var}</strong> ({best_env})<br>'
    html += f'<span style="font-size: 32px; color: #000; font-weight: 900; display: inline-block; margin-top: 8px;">{best_val:.4f}</span></div>'
    html += f'</div>'
    
    document.getElementById("scorecard-container").innerHTML = html

# ---------------------------------------------------------------------------------------
# "Last Run" column — the newest `config_snapshot_*/snapshot_<YYYYMMDD_HHMMSS>` marker the
# DA pipeline found in the candidate's seed folders, i.e. when those results were last
# (re)generated. Without it, two rows of the audit map that differ only by a re-run are
# indistinguishable. Batches produced before the pipeline wrote `Latest_Snapshot` simply
# have no such column and both tables drop it rather than showing a blank one.
# ---------------------------------------------------------------------------------------
STAMP_COL = 'Latest_Snapshot'

def _fmt_stamp(stamp):
    # '20260506_034806' -> '2026-05-06 03:48:06'. Anything unexpected passes through.
    t = str(stamp or "").strip()
    if t in ("", "nan", "NaN", "None"):
        return ""
    if len(t) == 15 and t[8] == "_" and t.replace("_", "").isdigit():
        return f"{t[0:4]}-{t[4:6]}-{t[6:8]} {t[9:11]}:{t[11:13]}:{t[13:15]}"
    return t

def _stamp_map():
    # Candidate -> newest stamp. The aggregated CSV already carries one value per
    # candidate, but max() keeps this honest if a future file ever splits it finer.
    if df_agg is None or STAMP_COL not in df_agg.columns:
        return {}
    out = {}
    pairs = df_agg[['Candidate', STAMP_COL]].drop_duplicates()
    for cand, stamp in zip(pairs['Candidate'], pairs[STAMP_COL]):
        text = _fmt_stamp(stamp)
        if text:
            key = str(cand)
            out[key] = max(out.get(key, ""), text)
    return out

def _stamp_cell(stamp_map, cand):
    return (f'<td style="width:150px;white-space:nowrap;font-size:11px">'
            f'{stamp_map.get(str(cand), "&mdash;")}</td>')

def render_selection_map(x_categories, x_axis, checked_cands):
    # Compact "plot legend" shown directly under the chart: only the candidates actually
    # in THIS plot, numbered in plot x-axis order, each mapped to its source path. The
    # full Path Audit Map below still lists every candidate in the batch.
    if df_agg is None: return
    p_col = 'Full_Path' if 'Full_Path' in df_agg.columns else 'Folder_Name'
    path_map = df_agg[['Candidate', p_col]].drop_duplicates().set_index('Candidate')[p_col].to_dict()
    stamp_map = _stamp_map()

    if x_axis == 'Candidate':
        # candidate mode: the x-axis categories ARE the candidates, in plotted order.
        ordered = [str(c) for c in x_categories]
        pos_header = "Plot X-Pos"
        note = "numbered left-to-right as they appear on the plot"
    else:
        # env mode: x-axis is the environment; candidates are averaged into each group.
        # Still list the selected candidates so the user knows what fed the bars.
        ordered = [str(c) for c in checked_cands]
        pos_header = "#"
        note = "averaged across the plotted environments (not an x-axis order)"

    rows = ""
    for i, c in enumerate(ordered, start=1):
        path = path_map.get(c, "— path not found —")
        segs = str(path).split('/')
        c_path = "".join([f'<span class="p-slash">/</span><span class="p-seg-{j%6}">{s}</span>' for j, s in enumerate(segs) if s])
        rows += (f'<tr><td style="text-align:center;width:80px"><strong>{i}</strong></td>'
                 f'<td style="width:100px"><strong>CAND_{c}</strong></td>'
                 + (_stamp_cell(stamp_map, c) if stamp_map else '') +
                 f'<td><code>{c_path}</code>{_folder_btn(path, c)}</td></tr>')

    html = (f'<div style="font-size:10px;color:#666;margin-bottom:6px;">{len(ordered)} selected — {note}'
            f' &middot; <b>&#8681; ZIP</b> downloads that run folder from the serving host'
            + (' &middot; <b>Last Run</b> = newest config snapshot in the run folder' if stamp_map else '')
            + f'</div>'
            f'<table><thead><tr>'
            f'<th style="width:80px">{pos_header}</th>'
            f'<th style="width:100px">ID</th>'
            + ('<th style="width:150px">Last Run</th>' if stamp_map else '') +
            f'<th>Source Path</th></tr></thead><tbody>{rows}</tbody></table>')
    document.getElementById("selection-map-container").innerHTML = html
    document.getElementById("selection-map-section").style.display = "block"

# ---------------------------------------------------------------------------------------
# U10: paper-style Result Matrices — rows = the CHECKED candidates, cols = ALL variants.
# The variant checkboxes are deliberately ignored (a paper table wants every method side by
# side); the candidate checkboxes are honoured (U10.1 — the batches carry 70+ candidates and
# nobody wants all of them in a paper table).
# (metric, caption, value format, annotate-with-failure-flags?)
# Captions are plain ASCII with " -- " so the same string feeds both the HTML (rendered as an
# em dash) and the LaTeX export (rendered as an en dash) without an entity/escaping split.
# ---------------------------------------------------------------------------------------
SUMMARY_TABLES = [
    ("n_success", "N_SUCCESS -- success rate (goal reached)", "{:.3f}", False),
    ("n_success_and_constraints", "N_SUCCESS + CONSTRAINT -- success rate (goal reached AND constraints satisfied)", "{:.3f}", False),
    ("n_steps", "N_STEPS -- steps taken (episode length)", "{:.1f}", True),
    ("avg_time", "AVG_TIME -- average computation time per planning step [s]", "{:.4f}", True),
]
summary_cache_key = None

def _seed_context():
    # Mirrors trigger_plot's own branch: custom seed mode only applies when the raw
    # per-seed CSV actually loaded, otherwise everything falls back to the aggregate.
    seed_mode = document.getElementById("seed-mode-select").value
    if seed_mode == "custom" and df_raw is not None:
        return "custom", tuple(sorted(int(x) for x in get_checked("seed-check")))
    return "standard", ()

def _summary_stats(env, seed_mode, seeds):
    # -> ({(metric, cand, variant): {mean, std, count}}, candidates, variants)
    metrics = [t[0] for t in SUMMARY_TABLES]
    if seed_mode == "custom":
        d = df_raw[(df_raw['halfspace_variant'] == env) & (df_raw['metric'].isin(metrics)) & (df_raw['seed'].isin(list(seeds)))]
        if d.empty: return {}, [], []
        g = d.groupby(['metric', 'Candidate', 'variant'])['value']
        stats = pd.DataFrame({'mean': g.mean(), 'std': g.std(), 'count': g.count()})
    else:
        d = df_agg[(df_agg['halfspace_variant'] == env) & (df_agg['metric'].isin(metrics))]
        if d.empty: return {}, [], []
        val_col = 'mean' if 'mean' in d.columns else 'value'
        g = d.groupby(['metric', 'Candidate', 'variant'])
        # In the aggregated CSV 'std'/'count' are already across seeds, so just carry them
        # through (the groupby is a de-dup, one row per facet — mean/max are no-ops).
        stats = pd.DataFrame({
            'mean': g[val_col].mean(),
            'std': g['std'].mean() if 'std' in d.columns else float('nan'),
            'count': g['count'].max() if 'count' in d.columns else 1,
        })
    cands = sorted(d['Candidate'].astype(str).unique(), key=lambda c: (0, int(c)) if c.isdigit() else (1, c))
    variants = sorted(d['variant'].unique())
    return stats.to_dict('index'), cands, variants

def _cell_stats(rec, metric, cand, var):
    # None for a facet that simply wasn't run (the NULL case) or whose mean is NaN.
    e = rec.get((metric, cand, var))
    if e is None: return None
    try:
        m = float(e.get('mean'))
    except (TypeError, ValueError):
        return None
    if m != m: return None
    try:
        cnt = int(e.get('count'))
    except (TypeError, ValueError):
        cnt = 1
    try:
        sd = float(e.get('std'))
    except (TypeError, ValueError):
        sd = float('nan')
    return m, sd, cnt

def _fmt_cell(st, fmt):
    # Single seed -> bare number. Multiple seeds -> mean +- standard error of the mean.
    m, sd, cnt = st
    txt = fmt.format(m)
    if cnt > 1 and sd == sd:
        txt += ' <span class="sem">&plusmn; ' + fmt.format(sd / (cnt ** 0.5)) + '</span>'
    return txt

def _fail_flags(rec, cand, var):
    # "did N_SUCCESS+CONSTRAINT win for this candidate/variant?" — a perfect cell is
    # n_success == 1 (goal always reached) AND n_success_and_constraints == n_success
    # (constraints never cost a success). Anything less is flagged with the reason(s).
    tol = 1e-9
    ns = _cell_stats(rec, 'n_success', cand, var)
    nsc = _cell_stats(rec, 'n_success_and_constraints', cand, var)
    flags = []
    if ns is not None and ns[0] < 1.0 - tol:
        flags.append("goal")
    if nsc is not None:
        base = ns[0] if ns is not None else 1.0
        if nsc[0] < base - tol:
            flags.append("constraint")
    return flags

def _render_matrix(rec, metric, fmt, annotate, cands, variants):
    head = '<thead><tr><th class="corner">Candidate</th>' + "".join(f'<th>{v}</th>' for v in variants) + '</tr></thead>'
    rows = []
    for c in cands:
        cells = [f'<td class="rowhead">CAND_{c}</td>']
        for v in variants:
            st = _cell_stats(rec, metric, c, v)
            if st is None:
                cells.append('<td class="nullcell">&mdash;</td>')
                continue
            txt = _fmt_cell(st, fmt)
            if annotate:
                flags = _fail_flags(rec, c, v)
                if flags:
                    txt += ' <span class="flag">(' + ", ".join(flags) + ')</span>'
            cells.append(f'<td title="n={st[2]} seed(s)">{txt}</td>')
        rows.append("<tr>" + "".join(cells) + "</tr>")
    return ('<div class="paper-tbl-wrap"><table class="paper-tbl">' + head
            + '<tbody>' + "".join(rows) + '</tbody></table></div>')

def _summary_context():
    # Single source of truth for BOTH the on-page matrices and the LaTeX export, so the .tex
    # can never disagree with what is on screen. -> (ctx_dict, error_message)
    if df_agg is None:
        return None, "No batch loaded — hit SYNC_SOURCE first."
    env = document.getElementById("env-select").value
    seed_mode, seeds = _seed_context()
    if seed_mode == "custom" and not seeds:
        return None, "Custom Seed Compare: select at least one seed."
    checked_cands = get_checked("cand-check")
    if not checked_cands:
        return None, "No candidates selected — tick some in the sidebar (6. Candidates)."
    rec, _avail_cands, variants = _summary_stats(env, seed_mode, seeds)
    if not variants:
        return None, f"No data at all for environment {env}."
    # Rows = every CHECKED candidate, numeric-aware order (same as the sidebar). A candidate
    # with no run in this env is kept as an all-NULL row rather than silently dropped — the
    # user asked for it, so its absence is itself the result.
    cands = sorted(checked_cands, key=lambda c: (0, int(c)) if c.isdigit() else (1, c))
    return {"env": env, "seed_mode": seed_mode, "seeds": seeds,
            "rec": rec, "cands": cands, "variants": variants}, None

def _seed_txt(ctx):
    return "all available seeds per cell" if ctx["seed_mode"] == "standard" \
        else "seeds " + ", ".join(str(s) for s in ctx["seeds"])

def render_summary_tables(force=False):
    global summary_cache_key
    if df_agg is None: return
    env = document.getElementById("env-select").value
    seed_mode, seeds = _seed_context()
    # U10.1: the candidate checkboxes now DO drive these tables, so they join the cache key.
    # The variant checkboxes still don't (all variants are always columns), which is what
    # keeps ticking through variants cheap.
    key = (env, seed_mode, seeds, tuple(get_checked("cand-check")), data_version)
    if key == summary_cache_key and not force: return
    summary_cache_key = key

    container = document.getElementById("summary-container")
    document.getElementById("summary-section").style.display = "block"

    ctx, err = _summary_context()
    if ctx is None:
        container.innerHTML = f'<div class="tbl-note" style="color:#c62828"><b>{err}</b></div>'
        return

    cands, variants = ctx["cands"], ctx["variants"]
    blocks = ['<div class="tbl-note">'
              f'Environment <b>{ctx["env"]}</b> &middot; {_seed_txt(ctx)} &middot; {len(cands)} selected candidates &times; {len(variants)} variants.<br>'
              'A cell aggregating &gt;1 seed shows <b>mean &plusmn; standard error</b> (std&nbsp;/&nbsp;&radic;n); a single-seed cell shows the plain value '
              '(hover a cell for its seed count). <b>&mdash;</b> = that candidate/variant combination was never run.<br>'
              'In the N_STEPS and AVG_TIME tables a trailing <span class="flag">(goal, constraint)</span> marks a cell where '
              'N_SUCCESS+CONSTRAINT did <b>not</b> win &mdash; <span class="flag">goal</span> = goal not always reached, '
              '<span class="flag">constraint</span> = a constraint was violated. Unmarked numbers are fully successful runs.<br>'
              'Rows follow <b>6. Candidates</b>; columns are always every variant. '
              '<b>EXPORT ZIP</b> writes exactly these four tables to a .tex file inside the archive.'
              '</div>']
    for i, (metric, caption, fmt, annotate) in enumerate(SUMMARY_TABLES, start=1):
        blocks.append(f'<div class="tbl-caption">Table {i} &mdash; {caption.replace(" -- ", " &mdash; ")}</div>')
        blocks.append(_render_matrix(ctx["rec"], metric, fmt, annotate, cands, variants))
    container.innerHTML = "".join(blocks)

# ---------------------------------------------------------------------------------------
# U10.1: LaTeX export of the same four matrices — one standalone, compilable .tex file.
# ---------------------------------------------------------------------------------------
def _tex_escape(s):
    s = str(s)
    for a, b in (("\\", r"\textbackslash{}"), ("&", r"\&"), ("%", r"\%"), ("$", r"\$"),
                 ("#", r"\#"), ("_", r"\_"), ("{", r"\{"), ("}", r"\}"),
                 ("~", r"\textasciitilde{}"), ("^", r"\textasciicircum{}")):
        s = s.replace(a, b)
    return s

def _tex_cell(st, fmt, flags):
    if st is None:
        return "--"
    m, sd, cnt = st
    body = fmt.format(m)
    if cnt > 1 and sd == sd:
        body += r" \pm " + fmt.format(sd / (cnt ** 0.5))
    txt = "$" + body + "$"
    if flags:
        txt += r"\,{\tiny (" + ", ".join(flags) + ")}"
    return txt

def _tex_table(ctx, metric, caption, fmt, annotate, idx):
    rec, cands, variants = ctx["rec"], ctx["cands"], ctx["variants"]
    lines = [r"\begin{table}[htbp]", r"\centering",
             r"\caption{" + _tex_escape(caption) + "}",
             r"\label{tab:" + metric.replace("_", "-") + "}",
             # 18-ish variant columns never fit \textwidth at a readable font size; let
             # LaTeX shrink the box instead of silently overflowing into the margin.
             r"\resizebox{\textwidth}{!}{%",
             r"\begin{tabular}{l" + "r" * len(variants) + "}",
             r"\toprule",
             "Candidate & " + " & ".join(_tex_escape(v) for v in variants) + r" \\",
             r"\midrule"]
    for c in cands:
        cells = [_tex_cell(_cell_stats(rec, metric, c, v), fmt,
                           _fail_flags(rec, c, v) if annotate else [])
                 for v in variants]
        lines.append(_tex_escape("CAND_" + str(c)) + " & " + " & ".join(cells) + r" \\")
    lines += [r"\bottomrule", r"\end{tabular}%", "}", r"\end{table}", ""]
    return "\n".join(lines)

def build_latex(ctx, batch_label, stamp):
    env, cands, variants = ctx["env"], ctx["cands"], ctx["variants"]
    p_col = 'Full_Path' if 'Full_Path' in df_agg.columns else 'Folder_Name'
    path_map = df_agg[['Candidate', p_col]].drop_duplicates().set_index('Candidate')[p_col].to_dict()

    # Keep every emitted byte ASCII: the file carries no \usepackage[utf8]{inputenc}, and a
    # stray em dash even inside a % comment trips older TeX installs.
    out = ["% FM-PCC Matrix Explorer - Data_Analysis/Visualizer/index.html (SCIENTIFIC_SUITE_v3.12)",
           f"% generated {stamp}",
           f"% batch: {batch_label}",
           r"\documentclass[10pt]{article}",
           r"\usepackage[landscape,margin=1.5cm]{geometry}",
           r"\usepackage{booktabs}",
           r"\usepackage{graphicx}",
           r"\begin{document}",
           "",
           r"\section*{FM-PCC results -- " + _tex_escape(env) + "}",
           "",
           r"\noindent\textbf{Batch:} \texttt{" + _tex_escape(batch_label) + r"}\\",
           r"\textbf{Environment:} " + _tex_escape(env) + r"\\",
           r"\textbf{Seeds:} " + _tex_escape(_seed_txt(ctx)) + r"\\",
           r"\textbf{Generated:} " + _tex_escape(stamp),
           "",
           r"\bigskip\noindent Cells aggregating more than one seed report "
           r"$\mathrm{mean} \pm \mathrm{SEM}$ ($\mathrm{std}/\sqrt{n}$); single-seed cells report the "
           r"plain value. \texttt{--} marks a candidate/variant combination that was never run. "
           r"In Tables~3 and~4 a trailing {\tiny (goal, constraint)} marks a cell whose "
           r"N\_SUCCESS+CONSTRAINT did not win: \emph{goal} = the goal was not always reached, "
           r"\emph{constraint} = a constraint was violated.",
           ""]
    for i, (metric, caption, fmt, annotate) in enumerate(SUMMARY_TABLES, start=1):
        out.append(_tex_table(ctx, metric, caption, fmt, annotate, i))

    # Candidate -> source path audit. verbatim so the long cluster paths need no escaping.
    out += [r"\section*{Candidate source paths}", r"{\footnotesize", r"\begin{verbatim}"]
    stamp_map = _stamp_map()
    for c in cands:
        out.append(f"CAND_{c}  {path_map.get(c, 'path not found')}")
        if stamp_map.get(str(c)):
            out.append(f"          last run {stamp_map[str(c)]}")
    out += [r"\end{verbatim}", "}", "", r"\end{document}", ""]
    return "\n".join(out)

def render_path_map():
    if df_agg is None: return
    p_col = 'Full_Path' if 'Full_Path' in df_agg.columns else 'Folder_Name'
    has_missing = 'Missing_Seeds' in df_agg.columns
    stamp_map = _stamp_map()

    cols_to_get = ['Candidate', p_col]
    if has_missing: cols_to_get.append('Missing_Seeds')

    # same numeric-vs-lexicographic concern as populate_dynamic_filters() above.
    _dedup = df_agg[cols_to_get].drop_duplicates()
    try:
        mapping = _dedup.sort_values('Candidate', key=lambda s: s.astype(int))
    except ValueError:
        mapping = _dedup.sort_values('Candidate')
    
    html = '<table><thead><tr><th style="width:100px">ID</th>'
    if has_missing: html += '<th style="width:120px; color: orange;">Warnings</th>'
    if stamp_map: html += '<th style="width:150px">Last Run</th>'
    html += '<th>Source Path (Audit)</th></tr></thead><tbody>'

    for _, row in mapping.iterrows():
        segs = str(row[p_col]).split('/')
        c_path = "".join([f'<span class="p-slash">/</span><span class="p-seg-{i%6}">{s}</span>' for i, s in enumerate(segs) if s])

        html += f'<tr><td><strong>CAND_{row["Candidate"]}</strong></td>'
        if has_missing:
            missing_val = row["Missing_Seeds"]
            if pd.isna(missing_val) or str(missing_val).strip() == '':
                html += '<td style="color: green; font-weight: bold;">ALL SEEDS</td>'
            else:
                html += f'<td style="color: orange; font-weight: bold;">MISSING:<br>{missing_val}</td>'

        if stamp_map:
            html += _stamp_cell(stamp_map, row["Candidate"])

        html += f'<td><code>{c_path}</code>{_folder_btn(row[p_col], row["Candidate"])}</td></tr>'

    document.getElementById("path-map-container").innerHTML = html + "</tbody></table>"

document.trigger_plot = create_proxy(trigger_plot)

<script>
    window.currentMode = "list";
    function switchMode(mode) {
        window.currentMode = mode;
        document.getElementById("btn-list").classList.toggle("active", mode === 'list');
        document.getElementById("btn-path").classList.toggle("active", mode === 'path');
        document.getElementById("input-list").style.display = mode === 'list' ? 'block' : 'none';
        document.getElementById("input-path").style.display = mode === 'path' ? 'block' : 'none';
    }
    function applyZoom() {
        const val = parseFloat(document.getElementById("width-zoom").value);
        const imgs = document.querySelectorAll("#plot-area img");
        if (imgs.length > 0) {
            const img = imgs[0];
            if (!img.dataset.baseWidth) {
                img.dataset.baseWidth = img.naturalWidth || img.width || 800;
            }
            const bw = parseFloat(img.dataset.baseWidth);
            if (bw > 0) {
                img.style.width = (bw * val) + "px";
                img.style.height = "auto";
                img.style.maxWidth = "none";
            }
        }
    }
    
    function adjustZoom(delta) {
        const el = document.getElementById("width-zoom");
        let val = parseFloat(el.value) + delta;
        if (val < 0.1) val = 0.1;
        el.value = val.toFixed(1);
        document.getElementById("zoom-val").innerText = val.toFixed(1) + "x";
        applyZoom();
    }
    async function trigger_plot() { 
        if (window.document.trigger_plot) {
            try {
                await window.document.trigger_plot();
            } catch (e) {
                console.error("Plot error:", e);
            }
        }
    }
    
    function toggle_seed_mode() {
        const mode = document.getElementById("seed-mode-select").value;
        document.getElementById("custom-seed-panel").style.display = (mode === "custom") ? "block" : "none";
        trigger_plot();
    }
    
    // U11: delegated handler for the per-row "download this source folder" buttons. Delegation
    // (not inline onclick) because both path tables are re-rendered wholesale on every redraw,
    // and the folder paths contain characters that would break inline-attribute quoting.
    document.addEventListener("click", function (ev) {
        const btn = ev.target.closest ? ev.target.closest(".dl-folder") : null;
        if (!btn) return;
        ev.preventDefault();
        if (!window.document.download_folder) {
            alert("PyScript engine still loading — try again in a moment.");
            return;
        }
        window.document.download_folder(btn.dataset.path, btn.dataset.cand || "");
    });

    function bulkSelect(className, state) {
        const elements = document.getElementsByClassName(className);
        for (let e of elements) { e.checked = state; }
        trigger_plot();
    }
</script>
