<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FM-PCC Matrix Explorer</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background: #fff; color: #000; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 360px; background: #f8f8f8; border-right: 2px solid #000; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        h1 { font-size: 18px; border-bottom: 2px solid #000; padding-bottom: 10px; margin: 0; text-transform: uppercase; }
        .control-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
        label { font-size: 11px; font-weight: bold; color: #444; text-transform: uppercase; letter-spacing: 0.5px; }
        select, input { padding: 10px; border: 1px solid #000; width: 100%; box-sizing: border-box; font-family: inherit; background: #fff; }
        .mode-toggle { display: flex; gap: 10px; margin-bottom: 10px; }
        .mode-btn { font-size: 10px; padding: 5px 10px; border: 1px solid #000; cursor: pointer; background: #eee; text-transform: uppercase; font-weight: bold; }
        .mode-btn.active { background: #000; color: #fff; }
        .bulk-actions { display: flex; gap: 10px; margin-bottom: 5px; }
        .bulk-link { font-size: 10px; font-weight: bold; cursor: pointer; text-decoration: underline; color: #666; }
        .checkbox-list { border: 1px solid #000; background: #fff; padding: 10px; max-height: 140px; overflow-y: auto; font-size: 12px; text-align: left !important; }
        .checkbox-item { display: flex !important; align-items: flex-start !important; justify-content: flex-start !important; margin-bottom: 6px !important; text-align: left !important; }
        .checkbox-item input[type="checkbox"] { margin: 2px 8px 0 0 !important; flex-shrink: 0 !important; display: inline-block !important; width: auto !important; }
        .checkbox-item span { text-align: left !important; word-break: break-word !important; }
        .btn-main { padding: 12px; background: #000; color: #fff; border: none; cursor: pointer; font-weight: bold; width: 100%; text-transform: uppercase; }
        .btn-download { padding: 12px; background: #007bff; color: #fff; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; text-transform: uppercase; }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
        .toolbar { padding: 8px 20px; background: #000; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 11px; font-weight: bold; color: #0f0; }
        .content { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 30px; }
        .scorecard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .score-card { border: 1px solid #000; padding: 10px; background: #fff; }
        .score-val { font-size: 20px; font-weight: bold; }
        .score-label { font-size: 10px; color: #666; font-weight: bold; text-transform: uppercase; }
        #plot-area { background: #fff; border: 1px solid #000; padding: 15px; min-height: 500px; text-align: center; overflow-x: auto; }
        .path-section { border-top: 2px solid #000; padding-top: 20px; margin-bottom: 50px; }
        table { border-collapse: collapse; width: 100%; font-size: 11px; table-layout: fixed; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; overflow-wrap: break-word; }
        .p-seg-0 { color: #c62828; font-weight: bold; }
        .p-seg-1 { color: #1565c0; font-weight: bold; }
        .p-seg-2 { color: #2e7d32; font-weight: bold; }
        .p-seg-3 { color: #ef6c00; font-weight: bold; }
        .p-seg-4 { color: #6a1b9a; font-weight: bold; }
        .p-seg-5 { color: #00838f; font-weight: bold; }
    </style>

    <py-config>
        packages = ["pandas", "matplotlib"]
    </py-config>
</head>
<body>

<div class="sidebar">
    <h1>FM-PCC EXPLORER</h1>
    <div class="control-group">
        <label>1. Experiment Batch Source</label>
        <div class="mode-toggle">
            <div id="btn-list" class="mode-btn active" onclick="switchMode('list')">QUICK_LIST</div>
            <div id="btn-path" class="mode-btn" onclick="switchMode('path')">CUSTOM_PATH</div>
        </div>
        <div id="input-list"><select id="batch-select"></select></div>
        <div id="input-path" style="display:none"><input type="text" id="custom-path" placeholder="../analysis_results/batch_v3_.../candidates_multidimensional_aggregated.csv"></div>
    <div class="control-group">
        <label>7. Visual Zoom (Magnify)</label>
        <div style="display:flex; gap:5px;">
            <button class="mode-btn" onclick="adjustZoom(-0.2)" style="flex:1">SMALLER</button>
            <button class="mode-btn" onclick="adjustZoom(0.2)" style="flex:1">LARGER</button>
        </div>
        <div style="text-align:center; font-size:10px; font-weight:bold; margin-top:5px;">
            Scale: <span id="zoom-val">1.0x</span>
            <input type="hidden" id="width-zoom" value="1.0">
        </div>
    </div>
    <div class="control-group">
        <label>8. Matplotlib FigWidth</label>
        <input type="number" id="fig-width" value="10.0" step="1.0" onchange="trigger_plot()">
    </div>
    <button class="btn-main" py-click="load_data">SYNC_SOURCE</button>
        <button class="btn-download" id="download-btn" py-click="download_plot" style="display:none">DOWNLOAD_PNG</button>
    </div>
    <div id="controls-panel" style="display:none; flex-direction: column; gap: 20px;">
        <div class="control-group"><label>2. Analysis Mode</label><select id="mode-select" onchange="trigger_plot()"><option value="candidate">By Candidate</option><option value="env">By Environment</option></select></div>
        <div class="control-group"><label>2.5 Seed Mode</label><select id="seed-mode-select" onchange="toggle_seed_mode()"><option value="standard">Standard (Avg All Available)</option><option value="custom">Custom Seed Compare</option></select></div>
        <div class="control-group" id="custom-seed-panel" style="display:none;">
            <label>Select Seeds to Compare</label>
            <div class="checkbox-list" style="display:flex; flex-wrap:wrap; gap:5px;">
                <div class="checkbox-item"><input type="checkbox" class="seed-check" value="6" checked onchange="trigger_plot()"><span>6</span></div>
                <div class="checkbox-item"><input type="checkbox" class="seed-check" value="7" checked onchange="trigger_plot()"><span>7</span></div>
                <div class="checkbox-item"><input type="checkbox" class="seed-check" value="8" checked onchange="trigger_plot()"><span>8</span></div>
                <div class="checkbox-item"><input type="checkbox" class="seed-check" value="9" checked onchange="trigger_plot()"><span>9</span></div>
                <div class="checkbox-item"><input type="checkbox" class="seed-check" value="10" checked onchange="trigger_plot()"><span>10</span></div>
            </div>
            <div id="seed-error-msg" style="color:red; font-size: 11px; margin-top:5px; font-weight:bold;"></div>
        </div>
        <div class="control-group"><label>3. Metric</label><select id="metric-select" onchange="trigger_plot()"></select></div>
        <div class="control-group"><label>4. Environment Focus</label><select id="env-select" onchange="trigger_plot()"></select></div>
        <div class="control-group"><label>5. Variants</label><div class="bulk-actions"><span class="bulk-link" onclick="bulkSelect('var-check', true)">[ALL]</span><span class="bulk-link" onclick="bulkSelect('var-check', false)">[NONE]</span></div><div id="variant-list" class="checkbox-list"></div></div>
        <div class="control-group"><label>6. Candidates</label><div class="bulk-actions"><span class="bulk-link" onclick="bulkSelect('cand-check', true)">[ALL]</span><span class="bulk-link" onclick="bulkSelect('cand-check', false)">[NONE]</span></div><div id="candidate-list" class="checkbox-list"></div></div>
        <button class="btn-main" style="background:#444;" py-click="trigger_plot">REFRESH_RE_DRAW</button>
    </div>
</div>

<div class="main">
    <div class="toolbar"><div id="engine-status" class="status">ENGINE_READY</div><div>SCIENTIFIC_SUITE_v3.7</div></div>
    <div class="content">
        <div id="scorecard-area" style="display:none"><label>Performance Scorecard</label><div class="scorecard-grid" id="scorecard-container"></div></div>
        <div id="plot-area"><p style="padding-top: 200px; color: #999;">CHOOSE_EXPERIMENT_TO_START</p></div>
        <div class="path-section" id="path-section" style="display:none"><label>Path Audit Map</label><div id="path-map-container"></div></div>
    </div>
</div>

<script type="py">
import pandas as pd
import matplotlib.pyplot as plt
import io, json
from pyscript import display
from js import document, console, fetch, window, Uint8Array, File, URL
from pyodide.ffi import create_proxy

df = None
current_fig = None

async def init_manifest():
    import re
    try:
        # Fetch the directory listing directly (works with python -m http.server)
        response = await fetch("../analysis_results/")
        if response.ok:
            html = await response.text()
            # Find all links that look like batch_v3_ folders
            batches = re.findall(r'href="(batch_[^/"]+)/?"', html)
            # Remove duplicates and sort descending
            batches = sorted(list(set(batches)), reverse=True)
            
            if len(batches) > 0:
                options = "".join([f'<option value="{b}">{b}</option>' for b in batches])
                document.getElementById("batch-select").innerHTML = options
                document.getElementById("engine-status").innerHTML = "ENGINE_READY"
                document.getElementById("engine-status").style.color = "#0f0"
            else:
                document.getElementById("engine-status").innerHTML = "NO_BATCHES_FOUND"
                document.getElementById("engine-status").style.color = "orange"
        else:
            # Fallback to manifest if directory listing is forbidden
            resp2 = await fetch("../analysis_results/results_manifest.json")
            if resp2.ok:
                data = await resp2.json()
                batches = data.get("batches", [])
                if len(batches) > 0:
                    options = "".join([f'<option value="{b}">{b}</option>' for b in batches])
                    document.getElementById("batch-select").innerHTML = options
                    document.getElementById("engine-status").innerHTML = "ENGINE_READY"
                    document.getElementById("engine-status").style.color = "#0f0"
    except Exception as e:
        console.log(f"[ manifest error ] {e}")
        pass

async def load_data(event=None):
    global df_agg, df_raw
    mode = window.currentMode
    if mode == "list":
        batch = document.getElementById("batch-select").value
        path_agg = f"../analysis_results/{batch}/candidates_multidimensional_aggregated.csv"
        path_raw = f"../analysis_results/{batch}/candidates_multidimensional_raw.csv"
    else:
        path_agg = document.getElementById("custom-path").value
        path_raw = path_agg.replace("aggregated.csv", "raw.csv")
    
    try:
        console.log(f"[ loader ] Fetching from {path_agg}...")
        document.getElementById("engine-status").innerText = "FETCHING..."
        
        response = await fetch(path_agg)
        if not response.ok:
            raise Exception(f"HTTP {response.status}")
        csv_text = await response.text()
        df_agg = pd.read_csv(io.StringIO(csv_text), low_memory=False)
        # Checkbox values from the DOM are always JS strings (get_checked()), but
        # pandas infers 'Candidate' as int64 for the new numeric-labeled batches
        # (was object/str for the old A/B/C batches). Force str here so .isin()
        # against checked_cands matches either labeling scheme identically —
        # without this, numeric-candidate batches load fine but every plot filters
        # down to an empty dataframe (silently — no error, nothing to redraw).
        df_agg['Candidate'] = df_agg['Candidate'].astype(str)

        # Try fetch raw (silent fail if not found)
        resp_raw = await fetch(path_raw)
        if resp_raw.ok:
            df_raw = pd.read_csv(io.StringIO(await resp_raw.text()), low_memory=False)
            df_raw['Candidate'] = df_raw['Candidate'].astype(str)
        else:
            df_raw = None

        document.getElementById("controls-panel").style.display = "flex"
        document.getElementById("download-btn").style.display = "block"
        document.getElementById("path-section").style.display = "block"
        document.getElementById("scorecard-area").style.display = "block"
        populate_dynamic_filters()
        render_path_map()
        await trigger_plot(None)
        document.getElementById("engine-status").innerText = "SYNC_COMPLETE"
    except Exception as e:
        document.getElementById("engine-status").innerText = "LOAD_ERROR"
        console.log(str(e))

def populate_dynamic_filters():
    metrics = sorted(df_agg['metric'].unique())
    # U7 fix: default to a CORE metric, not the alphabetically-first one. Adding the
    # HardFlow-only metrics (activation_threshold, batch_size, ...) made 'a...' sort to
    # the top, so the dropdown defaulted to a metric that only hardflow_new npz has —
    # every non-hardflow variant then filtered to an empty subset (blank plot / stuck
    # placeholder). Prefer the headline metric so the initial + typical selection has data.
    default_metric = next((m for m in ["n_success_and_constraints", "n_success", "avg_time"] if m in metrics), metrics[0] if metrics else None)
    document.getElementById("metric-select").innerHTML = "".join([f'<option value="{m}"{" selected" if m == default_metric else ""}>{m.upper()}</option>' for m in metrics])
    envs = sorted(df_agg['halfspace_variant'].unique())
    document.getElementById("env-select").innerHTML = "".join([f'<option value="{e}">{e.upper()}</option>' for e in envs])
    # Do NOT auto-check every box on first load: large batches (many variants x
    # candidates) freeze the page trying to render the full matrix at once. Only
    # pre-select the first item in each list so an initial lightweight plot draws;
    # the user then picks the rest (or hits [ALL]).
    vars_list = sorted(df_agg['variant'].unique())
    document.getElementById("variant-list").innerHTML = "".join([f'<div class="checkbox-item"><input type="checkbox" class="var-check" value="{v}"{" checked" if i == 0 else ""} onchange="trigger_plot()"> <span>{v}</span></div>' for i, v in enumerate(vars_list)])
    # numeric-labeled batches (Candidate = "1".."48") must sort as numbers, not
    # lexicographically ("1","10","11",...,"2",...) — alphabetic labels ("A","B",...)
    # are untouched since they never match .isdigit().
    cands_list = sorted(df_agg['Candidate'].unique(), key=lambda c: (0, int(c)) if c.isdigit() else (1, c))
    document.getElementById("candidate-list").innerHTML = "".join([f'<div class="checkbox-item"><input type="checkbox" class="cand-check" value="{c}"{" checked" if i == 0 else ""} onchange="trigger_plot()"> <span>CAND_{c}</span></div>' for i, c in enumerate(cands_list)])

def show_no_data(metric, checked_vars, checked_cands, env):
    # U7 fix: never leave the "CHOOSE_EXPERIMENT_TO_START" placeholder (or a silent
    # blank) when a valid-looking selection has no rows — tell the user WHICH facet is
    # empty. Most common cause: a hardflow-only metric (activation_threshold / nlp_solves)
    # selected against non-hardflow variants, or a candidate that lacks the chosen env.
    env_line = f"<br>env = <b>{env}</b>" if env else ""
    msg = (f'<div style="padding:24px;color:#b71c1c;font-family:monospace;font-size:13px;line-height:1.6;">'
           f'<b>NO DATA FOR THIS SELECTION</b><br><br>'
           f'metric = <b>{metric}</b><br>'
           f'variants = {", ".join(checked_vars)}<br>'
           f'candidates = {", ".join("CAND_"+c for c in checked_cands)}{env_line}<br><br>'
           f'Tip: hardflow-only metrics (activation_threshold, nlp_solves, nfe, batch_size, '
           f'flow_steps) exist only for <b>hardflow_new*</b> variants. Pick a core metric '
           f'(n_success_and_constraints, avg_time) to compare across all variants.</div>')
    document.getElementById("plot-area").innerHTML = msg

async def trigger_plot(event=None):
    global df_agg, df_raw, current_fig
    if df_agg is None: return
    metric, mode, env = document.getElementById("metric-select").value, document.getElementById("mode-select").value, document.getElementById("env-select").value
    checked_vars, checked_cands = get_checked("var-check"), get_checked("cand-check")
    if not checked_vars or not checked_cands or not metric: return
    
    seed_mode = document.getElementById("seed-mode-select").value
    document.getElementById("seed-error-msg").innerText = ""
    x_axis = 'Candidate' if mode == "candidate" else 'halfspace_variant'
    
    if seed_mode == "custom" and df_raw is not None:
        checked_seeds = [int(x) for x in get_checked("seed-check")]
        if not checked_seeds:
            document.getElementById("seed-error-msg").innerText = "Select >= 1 seed."
            return
            
        mask = (df_raw['metric'] == metric) & (df_raw['variant'].isin(checked_vars)) & (df_raw['Candidate'].isin(checked_cands)) & (df_raw['seed'].isin(checked_seeds))
        if mode == "candidate": mask &= (df_raw['halfspace_variant'] == env)
        subset = df_raw[mask]
        
        # U7 fix: WARN about candidates missing a selected seed, but do NOT abort the
        # whole plot (that wiped everything the moment a partial-seed candidate — e.g.
        # a seed-6-only hardflow run — was included). Plot whatever seeds exist; the
        # groupby mean below just uses the available rows per candidate.
        warn = []
        for cand in checked_cands:
            cand_subset = subset[subset['Candidate'] == cand]
            found = set(cand_subset['seed'].unique())
            missing = set(checked_seeds) - found
            if missing:
                warn.append(f"CAND_{cand}: {sorted(missing)}")
        if warn:
            document.getElementById("seed-error-msg").innerText = "Note: plotting available seeds only — missing " + "; ".join(warn)
        if subset.empty:
            plt.close('all')
            show_no_data(metric, checked_vars, checked_cands, env if mode == "candidate" else None)
            return

        pivot_mean = subset.groupby([x_axis, 'variant'])['value'].mean().unstack()
        pivot_std = subset.groupby([x_axis, 'variant'])['value'].std().unstack() if len(checked_seeds) > 1 else None
        active_subset = subset
    else:
        mask = (df_agg['metric'] == metric) & (df_agg['variant'].isin(checked_vars)) & (df_agg['Candidate'].isin(checked_cands))
        if mode == "candidate": mask &= (df_agg['halfspace_variant'] == env)
        subset = df_agg[mask]
        if subset.empty:
            show_no_data(metric, checked_vars, checked_cands, env if mode == "candidate" else None)
            return
        val_col = 'mean' if 'mean' in df_agg.columns else 'value'
        pivot_mean = subset.groupby([x_axis, 'variant'])[val_col].mean().unstack()
        pivot_std = subset.groupby([x_axis, 'variant'])['std'].mean().unstack() if 'std' in df_agg.columns else None
        active_subset = subset

    cols = [v for v in checked_vars if v in pivot_mean.columns]
    pivot_mean = pivot_mean[cols]
    if pivot_std is not None: pivot_std = pivot_std[cols]
    
    try:
        calc_width = float(document.getElementById("fig-width").value)
    except:
        calc_width = 10.0
    
    plt.close('all')
    fig, ax = plt.subplots(figsize=(calc_width, 6))
    pivot_mean.plot(kind='bar', ax=ax, width=0.8, edgecolor='black', colormap='tab10', alpha=0.9, yerr=pivot_std, capsize=4)
    ax.legend(title="Variant", bbox_to_anchor=(1.05, 1), loc='upper left', fontsize=8)

    ax.grid(True, alpha=0.2, axis='y')
    ax.set_title(f"Dynamic Analysis: {metric.upper()}", fontsize=12, fontweight='bold'); ax.set_ylabel(metric)
    plt.tight_layout()
    current_fig = fig
    area = document.getElementById("plot-area")
    area.innerHTML = ""
    display(fig, target="plot-area")
    
    # Re-apply the Visual Zoom (CSS)
    import asyncio
    await asyncio.sleep(0.1)
    window.applyZoom()
    
    update_scorecard(active_subset, metric)

def download_plot(event):
    global current_fig
    if current_fig is None: return
    
    from datetime import datetime
    now = datetime.now().strftime("%Y%m%d_%H%M")
    metric = document.getElementById('metric-select').value
    env = document.getElementById('env-select').value
    checked_vars = get_checked("var-check")
    checked_cands = get_checked("cand-check")
    
    base_name = f"plot_{metric}_{env}_{len(checked_vars)}v_{len(checked_cands)}c_{now}"
    
    # 1. Download PNG
    buf = io.BytesIO(); current_fig.savefig(buf, format='png', dpi=300, bbox_inches='tight'); buf.seek(0)
    js_array = Uint8Array.new(buf.read()); file_png = File.new([js_array], f"{base_name}.png", { "type": "image/png" }); url_png = URL.createObjectURL(file_png)
    link_png = document.createElement("a"); link_png.href = url_png; link_png.download = f"{base_name}.png"; link_png.click(); URL.revokeObjectURL(url_png)
    
    p_col = 'Full_Path' if 'Full_Path' in df_agg.columns else 'Folder_Name'
    path_map = df_agg[['Candidate', p_col]].drop_duplicates().set_index('Candidate')[p_col].to_dict()
    
    metadata = f"AUDIT LOG: {base_name}\n"
    metadata += "="*40 + "\n"
    metadata += f"TIMESTAMP: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n"
    metadata += f"METRIC:    {metric}\n"
    metadata += f"ENV:       {env}\n\n"
    metadata += f"SELECTED VARIANTS ({len(checked_vars)}):\n"
    metadata += "\n".join([f" - {v}" for v in checked_vars]) + "\n\n"
    metadata += f"SELECTED CANDIDATES ({len(checked_cands)}):\n"
    for c in checked_cands:
        path = path_map.get(c, "Path not found")
        metadata += f" - CAND_{c} (Source: {path})\n"
    
    js_text = Uint8Array.new(metadata.encode()); file_txt = File.new([js_text], f"{base_name}.txt", { "type": "text/plain" }); url_txt = URL.createObjectURL(file_txt)
    link_txt = document.createElement("a"); link_txt.href = url_txt; link_txt.download = f"{base_name}.txt"; link_txt.click(); URL.revokeObjectURL(url_txt)

def get_checked(class_name):
    elements = document.getElementsByClassName(class_name)
    return [e.value for e in elements if e.checked]

def update_scorecard(subset, metric):
    if subset is None or subset.empty: return
    val_col = 'mean' if 'mean' in subset.columns else 'value'
    subset_clean = subset.dropna(subset=[val_col])
    if subset_clean.empty:
        document.getElementById("scorecard-container").innerHTML = '<div class="score-card" style="grid-column: span 4;">No valid data</div>'
        return
        
    if 'success' in metric.lower() or 'reward' in metric.lower():
        best_idx = subset_clean[val_col].idxmax()
    else:
        best_idx = subset_clean[val_col].idxmin()
        
    best_row = subset_clean.loc[best_idx]
    best_cand = best_row['Candidate']
    best_var = best_row['variant']
    best_env = best_row['halfspace_variant'] if 'halfspace_variant' in best_row else 'N/A'
    best_val = best_row[val_col]
    
    html = f'<div class="score-card" style="grid-column: span 4; background: #e8f5e9; border: 2px solid #2e7d32; text-align: center; padding: 15px;">'
    html += f'<div class="score-label" style="color: #2e7d32; font-size: 14px;">🏆 OVERALL BEST FOR: {metric.upper()}</div>'
    html += f'<div class="score-val" style="margin-top: 10px; font-size: 16px;">Candidate <strong>{best_cand}</strong> in <strong>{best_var}</strong> ({best_env})<br>'
    html += f'<span style="font-size: 32px; color: #000; font-weight: 900; display: inline-block; margin-top: 8px;">{best_val:.4f}</span></div>'
    html += f'</div>'
    
    document.getElementById("scorecard-container").innerHTML = html

def render_path_map():
    if df_agg is None: return
    p_col = 'Full_Path' if 'Full_Path' in df_agg.columns else 'Folder_Name'
    has_missing = 'Missing_Seeds' in df_agg.columns
    
    cols_to_get = ['Candidate', p_col]
    if has_missing: cols_to_get.append('Missing_Seeds')
    
    # same numeric-vs-lexicographic concern as populate_dynamic_filters() above.
    _dedup = df_agg[cols_to_get].drop_duplicates()
    try:
        mapping = _dedup.sort_values('Candidate', key=lambda s: s.astype(int))
    except ValueError:
        mapping = _dedup.sort_values('Candidate')
    
    html = '<table><thead><tr><th style="width:100px">ID</th>'
    if has_missing: html += '<th style="width:120px; color: orange;">Warnings</th>'
    html += '<th>Source Path (Audit)</th></tr></thead><tbody>'
    
    for _, row in mapping.iterrows():
        segs = str(row[p_col]).split('/')
        c_path = "".join([f'<span class="p-slash">/</span><span class="p-seg-{i%6}">{s}</span>' for i, s in enumerate(segs) if s])
        
        html += f'<tr><td><strong>CAND_{row["Candidate"]}</strong></td>'
        if has_missing:
            missing_val = row["Missing_Seeds"]
            if pd.isna(missing_val) or str(missing_val).strip() == '':
                html += '<td style="color: green; font-weight: bold;">ALL SEEDS</td>'
            else:
                html += f'<td style="color: orange; font-weight: bold;">MISSING:<br>{missing_val}</td>'
                
        html += f'<td><code>{c_path}</code></td></tr>'
        
    document.getElementById("path-map-container").innerHTML = html + "</tbody></table>"

document.trigger_plot = create_proxy(trigger_plot)
import asyncio
asyncio.ensure_future(init_manifest())
</script>

<script>
    window.currentMode = "list";
    function switchMode(mode) {
        window.currentMode = mode;
        document.getElementById("btn-list").classList.toggle("active", mode === 'list');
        document.getElementById("btn-path").classList.toggle("active", mode === 'path');
        document.getElementById("input-list").style.display = mode === 'list' ? 'block' : 'none';
        document.getElementById("input-path").style.display = mode === 'path' ? 'block' : 'none';
    }
    function applyZoom() {
        const val = parseFloat(document.getElementById("width-zoom").value);
        const imgs = document.querySelectorAll("#plot-area img");
        if (imgs.length > 0) {
            const img = imgs[0];
            if (!img.dataset.baseWidth) {
                img.dataset.baseWidth = img.naturalWidth || img.width || 800;
            }
            const bw = parseFloat(img.dataset.baseWidth);
            if (bw > 0) {
                img.style.width = (bw * val) + "px";
                img.style.height = "auto";
                img.style.maxWidth = "none";
            }
        }
    }
    
    function adjustZoom(delta) {
        const el = document.getElementById("width-zoom");
        let val = parseFloat(el.value) + delta;
        if (val < 0.1) val = 0.1;
        el.value = val.toFixed(1);
        document.getElementById("zoom-val").innerText = val.toFixed(1) + "x";
        applyZoom();
    }
    async function trigger_plot() { 
        if (window.document.trigger_plot) {
            try {
                await window.document.trigger_plot();
            } catch (e) {
                console.error("Plot error:", e);
            }
        }
    }
    
    function toggle_seed_mode() {
        const mode = document.getElementById("seed-mode-select").value;
        document.getElementById("custom-seed-panel").style.display = (mode === "custom") ? "block" : "none";
        trigger_plot();
    }
    
    function bulkSelect(className, state) {
        const elements = document.getElementsByClassName(className);
        for (let e of elements) { e.checked = state; }
        trigger_plot();
    }
</script>

</body>
</html>
