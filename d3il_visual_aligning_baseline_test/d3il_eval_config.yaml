# D3IL Visual Aligning Baseline — eval config
# Read by eval_d3il_visual_aligning.py via yaml.safe_load (no Hydra).
# All values can be overridden by CLI args (see --help).

# ── Agent ──────────────────────────────────────────────────────────────────────
# agent_name:      used for output dir naming and checkpoint filename lookup
# agent_cfg_group: Hydra agents group override (filename in d3il/configs/agents/ without .yaml)
agent_name:      "ddpm_encdec_vision"
agent_cfg_group: "ddpm_encdec_vision_agent"

# ── Paths ──────────────────────────────────────────────────────────────────────
# checkpoint_root: {root}/{agent_name}/seed_{s}/weights/  must contain eval_best_*.pth
# d3il_config_dir: path to d3il/configs/ (relative from repo root)
checkpoint_root: "logs/d3il_visual_aligning_baseline"
d3il_config_dir: "d3il/configs"

# ── Eval settings ──────────────────────────────────────────────────────────────
# SCALE: behavior entropy is only meaningful with many trajectories per context.
#   smoke (fast):   n_contexts=3,  n_trajectories_per_context=1   (success_rate only; entropy ~0/noisy)
#   paper-faithful: n_contexts=60, n_trajectories_per_context=18  (D3IL Table 4 → valid entropy)
#   → pass `--paper` (CLI) or "paper" (sbatch $4) to set 60×18 without editing this file.
seeds:                       [42]
n_contexts:                  3       # smoke: 3  |  paper: 60
n_trajectories_per_context:  1       # smoke: 1  |  paper: 18  (needed for entropy, paper Eq. 2)
eval_on_train:               false
max_episode_length:          400
if_vision:                   true    # true = capture bp_cam frames for video

# ── Output ─────────────────────────────────────────────────────────────────────
# record_mode: all | gif | video | none
record_mode: "all"
save_root:   "logs/d3il_visual_aligning_baseline"
device:      "cuda"

# ── DA_VA_v2 export (U4.3) ─────────────────────────────────────────────────────
# Additive second copy of the results in the Gen14 API shape, so this baseline is
# readable by Data_Analysis/DA_VA_v2 with no bridging:
#   {save_root}/{da_export_root_name}/d3il_baseline_{agent}/{seed}/results/d3il_baseline/
# Runs that finished BEFORE this existed are converted by
# `bridge_d3il_va_to_da_va_v2.py` into a `_`-prefixed root instead (leading
# underscore = legacy tree, DA_VA_v2 switches to its legacy reader).
# Never give this a name starting with "_" — that would mark fresh runs legacy.
da_export:           true
da_export_root_name: "DA_VA_d3il_baseline"
