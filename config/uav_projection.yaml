  # ══════════════════════════════════════════════════════════════════════════════
  # [Gen15 U14 2026-09-12] corridor_gate — a SLANTED HALFSPACE across the corridor
  #
  # WHY A HALFSPACE AND NOT ANOTHER BALL. U11/U12/U13 put a sphere on the corridor route at
  # r = 0.35 / 0.12 / 0.05 / 0.01 and every one returned collision_free = 0.000 with the
  # executed path BIT-IDENTICAL to the unprojected arm (max |dy| = 0.0000 m, max |dz| =
  # 0.0010 m). Radius, altitude, ceiling, the action-magnitude cap (`bounds_free`) and the
  # projection threshold (T=1) were each ruled out. A halfspace is the one constraint family
  # left that is KNOWN to bite on this stack — on `pillars` it takes af from 197.70 to 22.90
  # violations (rate 0.3118 -> 0.0584) and collision_free 0.000 -> 0.900.
  #
  # THE GEOMETRY (all numbers verified against the flown route, not assumed):
  #   corridor_path(x_start=-2.8, x_end=2.8)  ->  flight is LEFT to RIGHT.
  #   The gate rises left->right and is active from x=+0.40, so the drone meets the TIGHTEST
  #   point first (a head-on wall) and the wedge opens behind it. Mirroring it in x matters:
  #   the descending version eases the drone in and squeezes it last, which is not the demo.
  #
  #   raw line y = 0.15 + 0.20x   (slope 0.20, +11.31 deg, sec = 1.0198)
  #   effective boundary = raw - margin*sec      side 'below'  ->  drone centre must be UNDER it
  #     planner (margin 0.31): eff = 0.20x - 0.1661
  #     scorer  (margin 0.33): eff = 0.20x - 0.1865
  #
  #   x_active STARTS AT 0.40, NOT 0.13. 0.13 is where the PLANNER's slot opens; the SCORER
  #   uses margin 0.33 (r_drone + margin_base) and its slot does not open until x = 0.3327.
  #   Starting at 0.13 would score violations on x in [0.13, 0.33] that NO path can avoid, so
  #   collision_free could never reach 1 even for a perfect run. 0.40 clears that by 67 mm.
  #
  # WHAT IT DOES TO THE THREE TRAINED CHANNELS (scorer basis, margin 0.33):
  #     L  y = -0.12   CLEAN for all x            <- the escape route, and it is TRAINED data
  #     C  y =  0.00   blocked x in [0.40, 0.93]
  #     R  y = +0.12   blocked x in [0.40, 1.53]
  #   This is deliberately the EASIEST solvable form: the detour target is not a novel path,
  #   it is the L channel the generator already has demonstrations for. The projector only has
  #   to move the plan 0.120 m in y, onto a route the model has seen.
  #
  # 🔴 THE PREDICTION, ON RECORD BEFORE THE RUN. `action_bounds='auto'` derives the projector's
  # per-step action cap from this dataset's own observed range, and the corridor expert flies a
  # dead-straight line, so dy is degenerate:
  #     temp/0809/2026-09-07/00_05_59_uav_mix_eval_25495.log  (uav-corridor)
  #     action_bounds=auto -> lb=[ 1.24e-04 -2.20e-05 -2.20e-05] ub=[4.3886e-02 2.2e-05 2.2e-05]
  #   Riding this boundary needs dy/step = 0.20 * 4.3886e-02 = 8.78e-03  ->  399x the cap.
  #   Reaching L at all needs 0.120 m of lateral travel; 271 steps x 2.2e-05 = 6.0 mm available,
  #   i.e. 20x short. Compare pillars, where the SAME derivation gives dy = 3.97e-02 (1805x
  #   corridor's) and the projector does solve the geometry.
  #   So the honest expectation is that this FAILS like U11-U13 — and if it does, that is the
  #   result: the blocker is the DATASET's action range, not the constraint family, not the
  #   shape, and not the angle. A pass would refute that and is the more interesting outcome.
  #
  # GATES.  diffuser  n_violations > 0            (the gate actually bites)
  #         dpcc-t    collision_free_completed > 0 (the projector actually solves it)
  #         dpcc-t    executed path differs from diffuser in y by > 1 mm   <- the real question
  # ══════════════════════════════════════════════════════════════════════════════
  - name: corridor_gate
    scene: corridor
    geo_tag_suffix: '_hgg'
    constraint_types: ['dynamics', 'geo_bounds', 'halfspace', 'obstacles', 'bounds']
    planning_inflation: {r_drone: 0.31, margin_base: 0.0}
    workspace_bounds:             # unchanged from corridor_hg; y left to the wall halfspaces
      lb: [-4.0, -.inf, 0.30]
      ub: [ 4.0,  .inf, 1.80]
    halfspace_constraints:        # the two corridor walls, UNCHANGED, + the new gate
      - {line: [[-2.0, -0.45], [2.0, -0.45]], side: 'above', x_active: [-2.0, 2.0]}
      - {line: [[-2.0,  0.45], [2.0,  0.45]], side: 'below', x_active: [-2.0, 2.0]}
      - {line: [[-2.0, -0.25], [2.0,  0.55]], side: 'below', x_active: [ 0.40, 2.0]}   # U14 gate
    obstacle_constraints:         # UNCHANGED from corridor_hg — the finite wall-end caps
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [-2.0, -0.5], radius: 0.05}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [ 2.0, -0.5], radius: 0.05}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [-2.0,  0.5], radius: 0.05}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [ 2.0,  0.5], radius: 0.05}

  # ══════════════════════════════════════════════════════════════════════════════
  # [Gen15 U15 2026-09-13, rev2] corridor_gate_n1 — a SLIDE from the top wall, run with FMPCC_SAFE_EPS_FRAC=1.0
  #
  # rev2 (after job 25728): the U14 gate was replaced. U14's line started mid-corridor at
  # (0.40, 0.23) and rose to the wall, so its free end pointed into the flight path like a spike.
  # The rev2 line is a SLIDE instead: it leaves the top wall face flush at (0.0, 0.45) and descends
  # 6.8 deg to (2.0, 0.212) at the corridor exit, so the drone is pushed down gradually and released
  # where the walls end. Results of 25728 (U14 geometry) are superseded and were deleted on the remote.
  #
  # Sized so the drone body (r_drone 0.31, scorer and planner alike) is forced to y <= -0.100 at
  # the exit:
  #   raw y = 0.45 - 0.119 x ;  body boundary = raw - 0.31*1.0071
  #   route L (y -0.12): clean for all x (19.8 mm spare)  <- the escape channel, trained data
  #   route C (y  0.00): blocked x in [1.16, 2.00]
  #   route R (y +0.12): blocked x in [0.15, 2.00]
  #   sliding needs dy/step = 0.119 * 0.0439 = 5.2e-03 m = 24% of the FRAC=1.0 cap (0.0219)
  # A line that visibly crosses a route in the plot leaves less than the 0.62 m drone in this
  # 0.90 m corridor (temp/geo_demo/U15_block_truth.png), so the line must stay above the routes.
  #
  # 🔴 THIS ENTRY MEANS NOTHING WITHOUT THE ENV SETTING. The change under test is
  # `FMPCC_SAFE_EPS_FRAC=1.0` (default 1e-3), set per job in
  # Slurm_Codes/temp_bash/eval_20260913_u15_corridor_gate_n1.sh. A geo entry cannot carry it
  # (`_apply_geo_entry` copies six keys only), so the name is the reminder.
  #
  # WHY (U14 DA §5.3). The corridor expert never moves sideways, so actions[1] (dy) and
  # actions[2] (dz) are constant in the data. Fix_16 `scaled` gives a constant channel a width of
  # median(non-constant half-widths) x FRAC = 0.02188 x 1e-3 = 2.2e-05 m/step. The DPCC projector
  # solves in normalized units inside a hard box z in [-5, 5] (mix_uav/sampling/projection.py:205,
  # verbatim from upstream DPCC), which leaves 0.77 mm of sideways reach per plan — the gate needs
  # ~100 mm, so no feasible solution exists and the unprojected plan is kept silently.
  #
  # FRAC=1.0 gives an unused action axis the SAME scale as the action axis the expert did use:
  #   corridor dy/dz half-width 2.2e-05 -> 0.02188 m/step   (= the forward-step half-width)
  #   projector reach per 7-step plan 0.77 mm -> 766 mm;  riding the gate needs 40% of the cap
  # Same rule for every scene, no code change. A constant channel normalizes to 0 for ANY eps
  # (normalization.py docstring), so the checkpoint and the generator's training target are
  # unchanged. Pillars' dy is non-constant and is untouched by this setting; pillars' dz IS
  # constant and would also widen — any claim spanning both scenes needs pillars re-run under it.
  # ══════════════════════════════════════════════════════════════════════════════
  - name: corridor_gate_n1
    scene: corridor
    geo_tag_suffix: '_hggn'
    constraint_types: ['dynamics', 'geo_bounds', 'halfspace', 'obstacles', 'bounds']
    planning_inflation: {r_drone: 0.31, margin_base: 0.0}
    workspace_bounds:             # identical to corridor_gate
      lb: [-4.0, -.inf, 0.30]
      ub: [ 4.0,  .inf, 1.80]
    halfspace_constraints:        # the two corridor walls (unchanged) + the rev2 slide
      - {line: [[-2.0, -0.45], [2.0, -0.45]], side: 'above', x_active: [-2.0, 2.0]}
      - {line: [[-2.0,  0.45], [2.0,  0.45]], side: 'below', x_active: [-2.0, 2.0]}
      - {line: [[ 0.0,  0.45], [2.0,  0.212]], side: 'below', x_active: [ 0.0, 2.0]}   # U15 slide
    obstacle_constraints:         # identical to corridor_gate
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [-2.0, -0.5], radius: 0.05}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [ 2.0, -0.5], radius: 0.05}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [-2.0,  0.5], radius: 0.05}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [ 2.0,  0.5], radius: 0.05}

  # ══════════════════════════════════════════════════════════════════════════════
  # [Gen15 U16 2026-09-13] corridor_v2_slide — WIDE corridor (new MuJoCo scene) + slide halfspace
  #
  # WHY. In `corridor` the walls are 0.90 m apart and the quadrotor is 0.62 m rotor tip to rotor
  # tip (r_drone 0.31), leaving 0.28 m of centre-line room. Any halfspace that visibly crosses a
  # route leaves no gap a drone fits through (U15 rev1/rev2). corridor_v2 moves BOTH walls outward
  # in parallel and changes nothing else:
  #   scene_corridor.xml    wall centres y = +/-0.5, inner faces +/-0.45, clear 0.90 m, centre band +/-0.14
  #   scene_corridor_v2.xml wall centres y = +/-1.0, inner faces +/-0.95, clear 1.90 m, centre band +/-0.64
  #
  # NO RETRAINING. `scene: corridor` keeps the dataset, checkpoint, routes, start points, goals and
  # episode budget of the trained corridor model (state-only policy: it never sees the walls).
  # `scene_xml` swaps only the simulated MuJoCo scene for THIS entry (eval_mix_uav.py, U16). The
  # original corridor, its XML and every other entry are untouched.
  #
  # THE SLIDE. From the top wall at the corridor entrance (-2.0, 0.95), descending 14.0 deg to
  # (2.0, -0.05) at the exit. The raw line visibly crosses route C at x = 1.80, and it stays 0.90 m
  # above the bottom wall at the exit, so the drone (0.62 m) fits under it.
  #   drone-centre limit (raw - 0.31*sec): entrance +0.630, exit -0.370; 0.27 m of room below it
  #   route L (y -0.12): blocked x in [1.01, 2.00], must drop 0.25 m
  #   route C (y  0.00): blocked x in [0.53, 2.00], must drop 0.37 m
  #   route R (y +0.12): blocked x in [0.05, 2.00], must drop 0.49 m
  #   sliding needs dy/step 0.0110 = 50% of the FRAC=1.0 cap (0.0219). Run with FMPCC_SAFE_EPS_FRAC=1.0.
  #   After the exit the goal (2.8, route y) needs only y >= -0.30 (goal radius 0.30).
  #
  # ⚠️ Out-of-distribution by construction: the corridor model never saw |y| > ~0.13. The deepest
  # required drone centre (-0.37 m) is inside the projector's representable position box
  # (+/-5 normalized, ~+/-0.65 m for a p_y half-width of ~0.13, estimated, not measured).
  # ══════════════════════════════════════════════════════════════════════════════
  - name: corridor_v2_slide
    scene: corridor
    scene_xml: scene_corridor_v2.xml
    geo_tag_suffix: '_cv2s'
    constraint_types: ['dynamics', 'geo_bounds', 'halfspace', 'obstacles', 'bounds']
    planning_inflation: {r_drone: 0.31, margin_base: 0.0}
    workspace_bounds:             # same as corridor_hg; y is left to the wall halfspaces
      lb: [-4.0, -.inf, 0.30]
      ub: [ 4.0,  .inf, 1.80]
    halfspace_constraints:        # the WIDE walls' inner faces + the slide
      - {line: [[-2.0, -0.95], [2.0, -0.95]], side: 'above', x_active: [-2.0, 2.0]}
      - {line: [[-2.0,  0.95], [2.0,  0.95]], side: 'below', x_active: [-2.0, 2.0]}
      - {line: [[-2.0,  0.95], [2.0, -0.05]], side: 'below', x_active: [-2.0, 2.0]}   # U16 slide
    obstacle_constraints:         # the wide walls' finite ends (same caps as corridor_hg, moved out)
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [-2.0, -1.0], radius: 0.05}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [ 2.0, -1.0], radius: 0.05}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [-2.0,  1.0], radius: 0.05}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [ 2.0,  1.0], radius: 0.05}

  # ══════════════════════════════════════════════════════════════════════════════
  # 🔴🔴🔴 [Gen15 U17 — ABANDONED 2026-09-22, TOTAL FAILURE] 🔴🔴🔴
