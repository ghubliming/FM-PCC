  # 🔴 THE SCORER FOLLOWS AUTOMATICALLY — verified, not assumed. `_exec_constraint_violations`
  # (eval_mix_uav.py:792) reads `config['obstacle_constraints']` and scores at `radius + r_drone`
  # from `inflation` (0.31; it ignores `margin_base`). It is handed the resolved geo entry, so the
  # enlarged radius is the yardstick as well as the tube. If it were not, every row would read
