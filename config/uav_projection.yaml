  # through the extra 0.23 m in MuJoCo and it is scored as a constraint violation only.
  # Physical contact and constraint satisfaction are therefore DIFFERENT things on this entry —
  # a flight can be `phys_safe` (MuJoCo contact truth, eval_artifacts.py:211, radius-independent)
