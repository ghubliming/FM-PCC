  # ══════════════════════════════════════════════════════════════════════════════
  # [Gen15 U17 2026-09-18] pillars_xl / pillars_xxl — the pillars ENLARGED at test time  (ABANDONED, see above)
  #
  # WHY. `pillars_hg` tests the wrong thing. The constraint set it enforces is the one the
  # demonstration generator was built to satisfy:
  #     uav_expert_data_collect/trajectories.py:48
  #         _Y_L = PILLAR_Y_A - PILLAR_RADIUS - PILLAR_ROTOR_REACH - PILLAR_SAFETY   # = -1.11
  # and the projector enforces |y| >= 0.6 + 0.12 + 0.31 = 1.03. The flown routes sit at
  # |y| = 1.11 — 0.08 m INSIDE the feasible set before any projection runs. 4 of 4 demonstrated
  # routes satisfy the constraint set, tightening included, and the UNPROJECTED plan already
  # scores S&C 1.00 (fm) / 0.90 (mf) at K=5. So every projected configuration on this scene
  # measures how little of an ALREADY-FEASIBLE plan a method disturbs — not whether it can make
  # an infeasible plan feasible. Per-step projection with random selection *destroying* a clean
  # plan (1.00 -> 0.00), and endpoint projection "winning" by leaving the plan alone, are both
  # artefacts of that. It is why the models could not be ordered on this scene, and it is not a
