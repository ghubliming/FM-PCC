write_to_file: True

# UAV FM projection config — PROJECTION-ONLY params (Gen11 Epoch 7).
# Mirrors config/projection_eval.yaml (avoiding-d3il pattern).
# Loaded by eval_fm_uav.py via load_pcc_config(); also imported at the top of
# config/uav.py so that diffusion_timestep_threshold is available to the plan block.
#
# WHAT BELONGS HERE:  projection variants, constraint types, geometry (halfspace / obstacle /
#                     bounds coords), dt, enlarge margin.
# WHAT DOES NOT:      batch_size, control_hz, behavior_log, reanchor_alpha, lead_gain — those
#                     are eval control params that live in the plan_flow_matching_v3_uav block
#                     of config/uav.py (same pattern as avoiding-d3il.py).

# ── Eval run config (CLI overrides these; eval_fm_uav.py main() prints the source) ──
# seed     : which trained-model checkpoint seed to evaluate (matches train_fm_uav.py DEFAULT_SEEDS[0])
# n_trials : closed-loop rollouts per scene
seed: 6
n_trials: 10

# ── Policy threshold ─────────────────────────────────────────────────────────
# Used by plan block in config/uav.py as _yaml_threshold (same as avoiding-d3il.py
# reading from projection_eval.yaml); also read directly by eval_fm_uav.py.
diffusion_timestep_threshold: 0.5

# ── Projection variants ───────────────────────────────────────────────────────
# Exact same set as FMv3ODE / visual-aligning (DPCC paper Table 1), PLUS U8's three
# independent, composable constraint-group toggles (U_8_new_projection_var_upgrade):
#   model_free  → skip 'dynamics'                              (existing)
#   bounds_free → skip 'bounds' (the action-magnitude limit)    (new)
#   geo_free    → skip 'geo_bounds'+'halfspace'+'obstacles' AS A GROUP (new — the three
#                 "geometric/spatial" families move together, same as 'model_free' already
#                 gates the lone 'dynamics' family)
# These make per-scene single-family ablation ENTRIES unnecessary — every combination below
# runs against the ONE full-stack geo entry per scene (see geo_constraint_variants), so e.g.
# "dynamics only" is now `geo_free-bounds_free` on that one entry, not a separate geo variant.
# `-tightened` rule (U8c): tightening (`enlarge_constraints`) only shifts
# geo_bounds/halfspace/obstacles boundaries. So a `-tightened` sibling is meaningful iff the
# variant KEEPS geometry, and a no-op whenever `geo_free` removed it. Therefore:
#   • geometry-KEEPING variants get a `-tightened` sibling: model_free, bounds_free,
#     model_free-bounds_free (all leave geo_bounds/halfspace/obstacles ON).
#   • `geo_free*` variants get NONE — geometry is already gone, tightening touches nothing.
# (Unlike visual-aligning, where the geo loop AUTO-generates the tightened twin for every
# variant, this UAV yaml enumerates each `-tightened` explicitly — so they must be listed.)
# projection_variants: [
#   # ── DPCC paper Table 1 baselines ──
#   'diffuser',
#   'gradient',
#   'gradient-tightened',
#   'post_processing',
#   'post_processing-tightened',
#   'model_free',               # dynamics OFF, rest ON
#   'model_free-tightened',
#   # ── U8: constraint-group ablation toggles (composable, see docstring above) ──
#   'bounds_free',               # action-bound OFF, rest ON — geometry KEPT
#   'bounds_free-tightened',     # U8c: geometry kept → tightening is meaningful (mirrors model_free-tightened)
#   'geo_free',                  # geo_bounds+halfspace+obstacles OFF, rest ON (dynamics+bounds only)
#   'geo_free-bounds_free',      # dynamics ALONE (no bounds, no geometric constraints)
#   'geo_free-model_free',       # bounds ALONE (no dynamics, no geometric constraints)
#   'model_free-bounds_free',    # geometry ALONE (no dynamics, no action bound) — U8b: the
#                                #   missing 3rd of the "X alone" trilogy. Complements bounds-alone
#                                #   (geo_free-model_free) & dynamics-alone (geo_free-bounds_free);
#                                #   isolates geometry-without-dynamics for the U_13 study.
#   'model_free-bounds_free-tightened',  # U8c: geometry KEPT → tightening meaningful (the sibling U8b flagged)
#   # ── DPCC paper Table 1 main results ──
#   'dpcc-r',
#   'dpcc-r-tightened',
#   'dpcc-c',
#   'dpcc-c-tightened',
#   'dpcc-t',
#   'dpcc-t-tightened',
# ]

# ══ U5 (2026-08-27) — ACTIVE LIST ════════════════════════════════════════════════════════
# The block above is the pre-U5 list, kept commented for rollback (do not delete).
#
# WHY: the U8 ablation toggles (`geo_free`, `bounds_free`, `model_free` and their composites)
# were STUDY instruments — they answered "which constraint family does the work?" and that
# question is answered. Running them as standalone variants costs ~13 of 20 variant-slots per
# eval job for rows no benchmark table reports. U5 keeps only the two arms the benchmark
# hierarchy actually compares — DPCC (arm B) and HardFlow (arm C, listed in config/uav_mix.py) —
# plus the unprojected `diffuser` reference row, which is the denominator every DA needs.
#
# 🔴 `-geo_free` IS RETAINED, BUT ONLY AS A COMPOSABLE SUFFIX, NEVER AS A STANDALONE VARIANT.
# `dpcc-c-geo_free` = the full DPCC projector with the GEOMETRIC group (geo_bounds + halfspace
# + obstacles) switched off, while `dynamics` and the action-magnitude `bounds` stay ON. That
# is the "correct the dynamics and the action bound, ignore the scene geometry" projector.
# This needs NO new code path: the three gates in `setup_dpcc_projector` are substring tests
# (`'geo_free' not in variant`), and composing them onto a selector was the documented intent
# from U8 — see FM_v3_uav_test/eval_fm_uav.py:815, which already spells out
# `dpcc-c-geo_free-bounds_free`. A brand-new token would have had to be mirrored into BOTH
# eval scripts to keep Gen11 and Gen15 reading this shared yaml the same way; reusing the
# existing token keeps them identical by construction.
#
# ⚠️ SHARED FILE. config/uav.py (Gen11) and config/uav_mix.py (Gen15) both read this list, so
# this change reaches Gen11's next eval too. That is safe here precisely because `-geo_free`
# already exists in Gen11's gating code (eval_fm_uav.py:836/894/904) with identical semantics.
#
# Slots: 10 here + 7 HardFlow (config/uav_mix.py `hardflow_variants`) = 17 variants/job,
# down from 20 + 3 = 23.
projection_variants: [
  # ── unprojected reference (DPCC paper Table 1, row 1) — no projector at all ──
  'diffuser',

  # ── arm B: DPCC, FULL constraint stack (dynamics + bounds + geo_bounds + halfspace + obstacles) ──
  'dpcc-r',                    # random candidate selection
  'dpcc-r-tightened',
  'dpcc-c',                    # minimum-projection-cost selection
  'dpcc-c-tightened',
  'dpcc-t',                    # temporal-consistency selection
  'dpcc-t-tightened',

  # ── arm B': DPCC with GEOMETRY OFF — dynamics + action bound only (U5) ──
  # Enforces the physics (p_des ← act, p ← act) and the dataset action-magnitude cap, and
  # enforces NOTHING about walls, pillars or the workspace box. Violations are still SCORED
  # against the full raw geometry (`_exec_constraint_violations` is variant-independent), so a
  # clean row here means the GENERATOR flew a legal path on its own.
  # No `-tightened` siblings: tightening only shifts geo surfaces, which these rows removed.
  'dpcc-r-geo_free',
  'dpcc-c-geo_free',
  'dpcc-t-geo_free',

  # ── [Gen15 U12 2026-09-11] arm B'': DPCC with the ACTION BOUND off, geometry ON ──
  # DIAGNOSTIC. `bounds_free` skips the action-magnitude family only (eval_mix_uav.py:1259);
  # dynamics + geo_bounds + halfspace + obstacles all stay ON. It is the exact complement of
  # `-geo_free`.
  #
  # WHY IT WAS ADDED. On `corridor_ball_v2` the projector left the plan's altitude untouched
  # (`min_z == final_z` on 10/10 rollouts) and removed only 27.1 -> 25.8 violations. The eval's
  # own line says why:
  #     Fix_16 DEGENERATE actions[1]/[2]: constant in the expert data
  #     action_bounds=auto -> lb=[1.24e-04 -2.20e-05 -2.20e-05] ub=[4.39e-02 2.20e-05 2.20e-05]
  # The corridor expert flies a straight line at constant y AND constant z, so dy and dz have
  # ZERO variance in training; `action_bounds='auto'` derives the projector's action cap from
  # that range and leaves it ~2.2e-05 m/step in both axes — 8.7 mm over a 396-step episode,
  # against the ~0.43 m detour the obstacle demands.
  #
  # This row tests that hypothesis directly: same obstacle, same geometry, action cap REMOVED.
  #   collision_free > 0  -> the action bound was the blocker (fix = explicit `action_bounds`)
  #   collision_free = 0  -> the blocker is elsewhere; the diagnosis above is wrong
  #
  # ⚠️ SHARED FILE (config/uav.py Gen11 + config/uav_mix.py Gen15 both read this list). One
  # extra slot per job for anything that does NOT use UAV_MIX_VARIANTS; every current pipeline
  # does use it, so the practical cost is zero.
  'dpcc-t-bounds_free',
]

# ── Constraints (E9) ────────────────────────────────────────────────────────
# GLOBAL FALLBACK (used only if a scene has no entry in geo_constraint_variants below).
# dt = 1.0 because the action IS the position delta Δp_des (NOT velocity × physics-dt).
constraint_types: ['dynamics']
dt: 1.0
enlarge_constraints: 0.025   # tightening margin (DPCC paper); active only for -tightened variants

# Global-fallback placeholders (empty). Per-scene geometry lives in geo_constraint_variants.
workspace_bounds: null
halfspace_constraints: []
obstacle_constraints: []

# ── E9 inflation (always-on offset, distinct from -tightened enlarge) ─────────
# Every spatial surface is offset by (r_drone + margin_base) so the drone BODY clears the
# geometry, not just its center. Applied in setup_dpcc_projector; scene numbers below are
# RAW physical geometry (wall faces / pillar radii read from the scene XMLs).
#   r_drone: max PER-AXIS rotor reach at yaw=0 — rotor centers at (±0.14, ±0.18) + rotor
#            radius 0.13 → y-reach 0.18+0.13 = 0.31 m (x-reach 0.27). Matches
#            trajectories.py PILLAR_ROTOR_REACH = 0.31, the number the expert channels were
#            designed around. Fix_12: was 0.36 (worst-case DIAGONAL tip radius) — but the
#            drone never yaws (yaw=0 in all paths) and every wall/pillar approach here is
#            lateral, so 0.36 over-covered by 5 cm; combined with margin_base=0.05 the
#            0.41 m total closed BOTH trained pillar channels (y=±1.11) and left only an
#            untrained 14 cm centre corridor. See Fix_12 report/changelog for the math.
#   margin_base: planning safety on top of the body reach. Fix_12: 0.05 → 0.02 — the
#            corridor L/R expert channels sit at |y|=0.12 with wall faces at 0.45, i.e.
#            0.45-0.31-0.12 = 0.02 m is ALL the slack the expert data itself has; any
#            margin_base > 0.02 makes the trained corridor L/R routes infeasible.
inflation: {r_drone: 0.31, margin_base: 0.02}

# ── E9 shared action-magnitude bound (§2.2, Fix_3; split from geo box in Patch_Constraints_C3)
# lb/ub on the ACTION dims (0,1,2 = Δp_des), NOT on the velocity STATE. Restores the
# dataset-normalization guard that DPCC-avoiding had (on ['vx','vy']) and visual-aligning
# dropped. Scene-independent → gated by its OWN `'bounds'` constraint_types entry, INDEPENDENT
# of the geo/workspace box (which is gated by `'geo_bounds'` — Patch_Constraints_C3 split;
# these two used to be conflated under one `'bounds'` flag, mirroring the same bug found and
# fixed in visual-aligning, see logs_in_develop/Gen7_FMPCC_Viusal_Aligning/Patch_Constraints_C3/).
#
# SETTABLE — three forms:
#   'auto'              (DEFAULT, RECOMMENDED) — self-derives lb/ub from the dataset's OWN
#                        action normalizer (act_normalizer.mins/.maxs = the actual observed
#                        Δp_des min/max over the training data, fit at eval load time). This
#                        is what DPCC-avoiding's hardcoded ['vx','vy'] bound was hand-fitting
#                        for ITS OWN dataset — copying avoiding's NUMBER here would be wrong
#                        (different robot, different workspace scale, different expert
#                        speed); 'auto' reuses the SAME METHOD instead, correctly, with no
#                        placeholder and no manual cluster-side measurement required.
#   {lb: [.,.,.], ub: [.,.,.]}  — explicit override, e.g. to test a deliberately tighter or
#                        looser action cap than the dataset's own range.
#   null                 — disables the action-magnitude bound entirely (workspace box +
#                        halfspace + obstacles still apply if listed in constraint_types).
action_bounds: 'auto'

# ── E9 per-scene geometry — ONE full-stack entry per scene (U8 simplification) ────────────
# U_8_new_projection_var_upgrade: the per-scene single-family ablation entries from Fix_5
# (`<scene>_dynamics_only`, `<scene>_dynamics_bounds_only`) are REMOVED — they're redundant
# now that `bounds_free`/`geo_free` (projection_variants above) express the same ablations
# as variant-name toggles on this ONE entry. Naming simplified back to plain `<scene>` (no
# more `_combined_1` suffix — there's nothing left to disambiguate it from).
#
# The underlying mechanism (Fix_4: named entries + `scene:` field; Fix_6: eval_scene can run
# several active entries for one scene in a single job) is UNCHANGED and still available if a
# scene ever needs a genuinely different GEOMETRY (not just a different family subset) — e.g.
# an alternate arena size — but is not needed for constraint-family ablation anymore.
#
# Altitude band (z floor/ceiling) and exact arena extents are first-cut values — CONFIRM the
# flight altitude on the cluster from the expert trajectories; pillars/walls span z∈[0,2].
# [Gen15 U7 2026-09-04] SIX scene-geometry entries are now DEFINED (plus `empty_no_constraint`);
# three are ACTIVE.
#   <scene>      — the E9/Fix_12 geometry. Kept verbatim for rollback and A/B; every number in
#                  every DA up to 2026-09-03 was produced under these.
#   <scene>_hg   — "honest geometry" (U7). Same physical obstacles, but the SYNTHETIC parts
#                  corrected: walls limited to the x-range they actually occupy, the invented
#                  workspace box widened to the empty arena, and the arbitrary 2 cm
#                  `margin_base` pad dropped from the PLANNER only.
# 🔴 Do NOT activate a scene's `<scene>` and `<scene>_hg` entries in the SAME job: both run
#    (Fix_6 multi-match) and the job takes twice as long — K5 already hits the wall clock.
#    They land in different folders (`geo_tag_suffix`), so run them as separate submissions.
active_geo_variants: ['empty_no_constraint', 'corridor_hg', 'pillars_hg', 's_curve_hg']

geo_constraint_variants:

  # ── empty — NO constraints applied (explicit baseline / result denominator) ──
  - name: empty_no_constraint
    scene: empty
    constraint_types: []          # projector is a no-op; raw FM. MARKED: not a failed run.

  # ── corridor — box bounds + 2 wall halfspaces (m=0) + wall-end cap balls ─────
  # XML: walls at y=±0.5 (half-thick 0.05 → inner faces y=∓0.45), x∈[-2,2].
  # Full stack: all 5 families declared; ablations now come from projection_variants
  # (model_free/bounds_free/geo_free toggles), not from a separate geo entry.
  # Fix_12: box must CONTAIN start/goal after inflation — paths span x=±2.8, old ±3.0 box
  # minus margin excluded them (guaranteed infeasible start). x→±3.2 (±3.2-0.33=±2.87≥2.8).
  # z ub 1.60→1.80: altitude draw is U(0.90,1.30); old 1.60-margin ceiling clipped the top
  # of the draw range. 1.80-0.33=1.47 still < wall top (1.5) so walls can't be hopped.
  - name: corridor
    scene: corridor
    constraint_types: ['dynamics', 'geo_bounds', 'halfspace', 'obstacles', 'bounds']
    workspace_bounds:             # x-extent + altitude; y handled by the wall halfspaces
      lb: [-3.2, -.inf, 0.30]
      ub: [ 3.2,  .inf, 1.80]
    halfspace_constraints:
      - [[-2.0, -0.45], [2.0, -0.45], 'above']   # feasible y >= -0.45  (lower wall)
      - [[-2.0,  0.45], [2.0,  0.45], 'below']   # feasible y <=  0.45  (upper wall)
    obstacle_constraints:         # cap the finite wall ends (halfspace lines are infinite)
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [-2.0, -0.5], radius: 0.05}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [ 2.0, -0.5], radius: 0.05}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [-2.0,  0.5], radius: 0.05}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [ 2.0,  0.5], radius: 0.05}

  # ── pillars — box bounds + 6 cylinder balls (Fix_12: envelope halfspaces REMOVED) ──
  # XML: 6 pillars, y=±0.6, x∈{-2,0,2}, radius 0.12, full-height → 2D sphere_outside on [x,y].
  # Fix_12 changes (see Fix_12 report for the full math):
  #   - The y=±1.2 "envelope" halfspaces are GONE: they were synthetic (no wall exists in
  #     the XML), and inflated they closed both trained outer channels (y=±1.11) entirely —
  #     inflated pillar edge 0.6+0.12+margin always overlapped the inflated envelope. The
  #     y=±1.5 workspace box (kept) bounds the field instead: ±1.5-0.33=±1.17 ≥ 1.11 ✓.
  #     'halfspace' is dropped from constraint_types too so the geo_tag folder name stops
  #     advertising a family with zero entries.
  #   - Box x ±3.0→±3.6: pillar_path spans x=±3.2 — the old box excluded start AND goal
  #     (even before inflation). ±3.6-0.33=±3.27 ≥ 3.2 ✓. z ub 1.60→1.80 (altitude draw
  #     goes to 1.30; 1.80-0.33=1.47 ✓).
  #   - With margin=0.33 the outer channels are now [1.05,1.17] (12 cm, expert 1.11 centred)
  #     and the centre channel |y|≤0.15 — every trained route is feasible again.
  - name: pillars
    scene: pillars
    constraint_types: ['dynamics', 'geo_bounds', 'obstacles', 'bounds']
    workspace_bounds:
      lb: [-3.6, -1.5, 0.30]
      ub: [ 3.6,  1.5, 1.80]
    obstacle_constraints:
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [-2.0, -0.6], radius: 0.12}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [ 0.0, -0.6], radius: 0.12}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [ 2.0, -0.6], radius: 0.12}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [-2.0,  0.6], radius: 0.12}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [ 0.0,  0.6], radius: 0.12}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [ 2.0,  0.6], radius: 0.12}

  # ── s_curve — box bounds + per-segment switched wall halfspaces + corner balls ─
  # XML: seg1 walls centred y∈{-1.3,-0.3} x∈[-3,-0.5]; seg2 centred y∈{0.3,1.3} x∈[0.5,3];
  # box half-thickness 0.05 → INNER faces at ∓0.05 from the centreline.
  # Feasible set is NON-CONVEX; each wall halfspace is live only over its x-range (`x_active`),
  # selected per replan from the drone's current x (setup handles None = all-active fallback).
  # Fix_12: halfspace lines moved from wall CENTRELINES to INNER FACES (corridor's entry
  # already used inner faces — this one didn't; 5 cm error). Box x ±3.5→±3.6 (path spans
  # ±3.2; old lb+margin excluded the start), z ub 1.60→1.80 (altitude draw to 1.30;
  # 1.80-0.33=1.47 < wall top 1.5 ✓). Feasible corridor band with margin 0.33:
  # [-0.92,-0.68] (24 cm around the y=-0.8 expert route); crossover corner gate ~24 cm.
  - name: s_curve
    scene: s_curve
    constraint_types: ['dynamics', 'geo_bounds', 'halfspace', 'obstacles', 'bounds']
    workspace_bounds:
      lb: [-3.6, -1.6, 0.30]
      ub: [ 3.6,  1.6, 1.80]
    halfspace_constraints:
      - {line: [[-3.0, -0.35], [-0.5, -0.35]], side: 'below', x_active: [-3.0, -0.5]}  # seg1 upper wall inner face
      - {line: [[-3.0, -1.25], [-0.5, -1.25]], side: 'above', x_active: [-3.0, -0.5]}  # seg1 lower wall inner face
      - {line: [[ 0.5,  0.35], [ 3.0,  0.35]], side: 'above', x_active: [ 0.5,  3.0]}  # seg2 lower wall inner face
      - {line: [[ 0.5,  1.25], [ 3.0,  1.25]], side: 'below', x_active: [ 0.5,  3.0]}  # seg2 upper wall inner face
    obstacle_constraints:         # cap the inside corners at the crossover (wall ends)
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [-0.5, -0.3], radius: 0.05}
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [ 0.5,  0.3], radius: 0.05}

  # ══════════════════════════════════════════════════════════════════════════════
  # [Gen15 U7 2026-09-04] "Honest geometry" entries — pillars_hg / corridor_hg / s_curve_hg
  #
  # WHY. DA_20260903 Part II measured the free channel each scene leaves around its own expert
  # route and compared it against the policy's measured tracking error:
  #
  #   scene · route        channel half-width      best measured track_err     verdict
  #   pillars · outer        0.060 m                 0.336 m (geo_free)         5.6x too tight
  #   pillars · centre       0.150 m                 0.336 m                    2.2x too tight
  #   s_curve · corridor     0.120 m                 0.302 m                    2.5x too tight
  #   corridor · L and R     0.000 m                 n/a                        infeasible
  #
  # `corridor` L/R is the sharp one: expert channels sit at y = +/-0.12 and the planning band
  # is EXACTLY [-0.12, +0.12], so the trained route lies ON the boundary. The Fix_12 gate
  # passed it because penetration is 0.000, which is why U7 also makes that gate slack-aware.
  # Under those numbers success+constraints is bounded near zero for reasons that have nothing
  # to do with the engine, the objective or the projector -- 0/2876 on pillars is the geometry.
  #
  # WHAT CHANGED, and what deliberately did NOT. Only SYNTHETIC quantities are touched; every
  # number that corresponds to a physical geom in the scene XML is untouched.
  #   1. pillars workspace box y +/-1.5 -> +/-2.5, x +/-3.6 -> +/-4.0. scene_pillars.xml has NO
  #      walls -- the floor is a 10x10 plane and the box was invented. At +/-1.5 it was a second
  #      binding surface only 0.06 m outside the expert route; at +/-2.5 the pillars are the
  #      only thing that binds.
  #   2. corridor walls get `x_active: [-2.0, 2.0]`. scene_corridor.xml: `pos="0 +/-0.5 0.75"
  #      size="2.0 0.05 0.75"` -- the walls physically span x in [-2, 2], but the halfspaces
  #      were infinite lines constraining the approach and departure where no wall exists. The
  #      `x_active` mechanism already existed (s_curve uses it); corridor simply never did.
  #   3. `planning_inflation: {r_drone: 0.31, margin_base: 0.0}` on all three -- drops the
  #      arbitrary 2 cm pad from the PLANNER. `inflation` (0.31 + 0.02) is untouched and is
  #      still what `_exec_constraint_violations` scores collisions with, so this loosens the
  #      tube WITHOUT loosening the yardstick.
  #   4. Obstacle centres/radii, wall faces, altitude slab: UNCHANGED. They are physics.
  #
  # WHAT THIS DOES NOT FIX -- state it up front so the runs are not over-read:
  #   - pillars outer: the binding surface is now the pillar, and the expert route clears it by
  #     0.080 m by CONSTRUCTION (`trajectories.PILLAR_SAFETY = 0.08`, chosen when the data was
  #     generated on the assumption that 8 cm was "sufficient for PID tracking error"). No
  #     projector config can widen that. It needs a scene + dataset change.
  #   - corridor / s_curve: the physical gap is 0.90 m and the drone is 0.62 m wide. Best case
  #     slack is 0.140 m against a ~0.30 m tracking error. Expect S&C near 0 here too.
  # The point of these entries is to remove every ARTIFICIAL contribution to the deficit so
  # what remains is attributable to the policy and the scene, not to a config accident.
  # Changelog: logs_in_develop/Gen15/U7/
  # ══════════════════════════════════════════════════════════════════════════════

  - name: pillars_hg
    scene: pillars
    geo_tag_suffix: '_hg'
    constraint_types: ['dynamics', 'geo_bounds', 'obstacles', 'bounds']
    planning_inflation: {r_drone: 0.31, margin_base: 0.0}
    workspace_bounds:             # y widened to the empty arena; x clears the +/-3.2 path ends
      lb: [-4.0, -2.5, 0.30]
      ub: [ 4.0,  2.5, 1.80]
    obstacle_constraints:         # PHYSICAL: scene_pillars.xml cylinders, r=0.12, full height
      - {type: sphere_outside, dimensions: ['x', 'y'], center: [-2.0, -0.6], radius: 0.12}
