# General
write_to_file: True
exps: [
  'aligning-d3il-visual',
  'visual_aligning_dpcc',
  'fm_visual_aligning',
]
#seeds: [6, 7, 8, 9, 10]
seeds: [6]

# --- STATE-ONLY PARAMETERS (COMMENTED OUT: NOT NEEDED FOR VISUAL ALIGNING) ---
# avoiding_halfspace_variants: [
#   'top-right-hard',
#   'top-left-hard',
#   'both-hard',
# ] # NOT NEEDED: Aligning task represents open-table manipulation and has no vertical halfspace walls.
#
# n_trials: 2 # NOT NEEDED: Visual aligning uses 'n_contexts: 30' context rollouts for robust statistical evaluation.
#
# dt: {
#   'avoiding': 1,
# } # NOT IN USE: setup_dpcc_projector() defaults to dt=1.0 (config.get('dt', 1.0)).
#   # dt=1.0 IS CORRECT for this task: actions are position deltas [dx,dy,dz], not
#   # velocity × dt. The Euler dynamics constraint is c_pos[t+1] = c_pos[t] + 1.0 * act[t].
#   # DO NOT set dt=0.1 (the robot controller integration step) — that value belongs to
#   # the physical controller, not to the DPCC trajectory constraint scaling.
#
# observation_indices: {
#   'avoiding': {'x_des': 0, 'y_des': 1, 'x': 2, 'y': 3},
# } # NOT IN USE: Our eval script hardcodes trajectory indices directly in setup_dpcc_projector()
#   # as ('deriv', [6,0]), ('deriv', [7,1]), ('deriv', [8,2]). No YAML lookup needed.
#
# action_indices: {
#   'avoiding': {'vx': 0, 'vy': 1},
# } # NOT IN USE: Same reason — action dims 0-2 are hardcoded in setup_dpcc_projector().
#   # workspace_bounds (below) replaces the old 'bounds' dict for Cartesian safety limits.
# -----------------------------------------------------------------------------

# D3IL simulation parameters
n_contexts: 3
n_trajectories_per_context: 1

# Policy
diffusion_timestep_threshold: 0.5
mpc_foresight_stride: 6          # show every Nth replan decision point in standalone MPC plot (default 6)

# Projection
# Exact DPCC reference variant list (from dpcc/config/projection_eval.yaml).
# Trajectory selection driven by variant name, matching DPCC eval.py exactly:
#   trajectory_selection = 'random'              (default — always index 0, deterministic)
#   if 'dpcc-t' in variant → 'temporal_consistency'
#   if 'dpcc-c' in variant → 'minimum_projection_cost'
# -tightened = workspace bounds tightened by enlarge_constraints
# dt0p25/dt0p5/dt2p0/dt4p0 = dynamics constraint dt scale factor
projection_variants: [
  'diffuser',
  # Figure 2, Table 1 and Figure 3:
  'dpcc-r',
  'dpcc-r-tightened',
  'dpcc-c',
  'dpcc-c-tightened',
  'dpcc-t',
  'dpcc-t-tightened',
  # Table 1:
  #'diffuser',
  'gradient',
  'gradient-tightened',
  'post_processing',
  'post_processing-tightened',
  'model_free',
  'model_free-tightened',
  # Table 2:
  'dpcc-c-tightened-dt0p25',
  'dpcc-c-tightened-dt0p5',
  'dpcc-c-tightened-dt2p0',
  'dpcc-c-tightened-dt4p0',
]

# --- STATE-ONLY PROJECTION BASES (COMMENTED OUT: NOT NEEDED FOR VISUAL ALIGNING) ---
# projection_cost: 'pos_vel' # NOT NEEDED: Visual aligning cost is optimized directly on the 6D states and actions.
#
# halfspace_constraints: {
#   'avoiding-d3il': [
#     [[0.8, -0.5], [0.4, 0.5], 'below'],
#     [[0.2, -0.5], [0.6, 0.5], 'below'],
#   ],
# } # NOT NEEDED: Aligning workspace has no simulated halfspace obstacles.
#
# obstacle_constraints: {
#   'avoiding-d3il': [
#     {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, 0.08], 'radius': 0.06},
#   ]
# } # NOT NEEDED: Aligning workspace has no simulated spherical obstacles.
#
# bounds: {
#   'avoiding-d3il': [
#     {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.01, 0]},
#   ],
# } # NOT NEEDED: Replaced by 'workspace_bounds' below, which enforces safe physical Cartesian ranges.
#
# plot_how_many: 10
# ax_limits: {
#   'avoiding-d3il': [[0.2, 0.8], [-0.3, 0.4]]
# } # NOT NEEDED: Handled visually via 3D MuJoCo rendering and Tee log interceptors instead of 2D matplotlib axes.
# ---------------------------------------------------------------------------------

# Physical Franka EE workspace bounds in metres (x=forward, y=lateral, z=vertical).
# Franka panda table-top setup — aligning task (push block to goal):
#   x:  0.30–0.70 m  — forward reach from robot base; table surface starts ~0.30 m
#   y: -0.35–0.35 m  — left/right of centre-line; covers full block travel lane
#   z:  0.05–0.40 m  — above table; 0.05 m floor prevents EE from hitting table,
#                      0.40 m ceiling prevents upward escape during pushes
# Constraint effect: DPCC projector clips generated c_pos trajectory waypoints
# (trajectory dims 6-8) so every planned EE position stays inside this box.
# Expected behaviour: trajectories that would drive the EE off-table or into the
# robot body are projected back to the nearest feasible point before execution.
# If projection is too aggressive (robot stalls), widen bounds or disable 'bounds'.
workspace_bounds:
  lb: [0.3, -0.35, 0.05]
  ub: [0.7,  0.35, 0.40]

# DPCC Projection parameters (defaults — overridden per geo_constraint_variants entry below)
# enlarge_constraints: inward tightening (m) applied to workspace_bounds when the
# variant name contains 'tightened' (e.g. 'dpcc-r-tightened'). Shrinks the safe
# box by this margin on every side, adding a safety buffer before the hard wall.
enlarge_constraints: 0.01

# constraint_types: fallback used only when geo_constraint_variants is absent.
# Each geo entry below overrides this value — do not tune here, tune in the geo entries.
#   'bounds'   — box bounds on EE position (workspace_bounds above, dims 6-8)
#   'dynamics' — Euler integration link: c_pos[t+1] = c_pos[t] + dx[t] (dims 6←0, 7←1, 8←2)
#                skipped for 'model_free' variants (no kinematic model assumed)
constraint_types: ['bounds', 'dynamics']  # AUDIT-FIX-2 (KEY_fix_6/BUG_REPORT.md)

# ── Geo constraint sweep ────────────────────────────────────────────────────────
# Outer loop over geometric constraint configurations.  Each entry produces a
# separate output subtree:  results/{name}/{variant}/
#
# Naming scheme:
#   no index      — no tunable geometric parameters (no_constraint, dynamics_only)
#   _1 / _2       — parameter variants for single-type configs (bounds_only, obstacle_only)
#   combined_N    — numbered combination slots; content defined by constraint_types below
#
# Named dims for obstacle_constraints (map to 9D trajectory indices):
#   'x'=6  'y'=7  'z'=8  (EE Cartesian position, metres)
#   'dx'=0 'dy'=1 'dz'=2 (action / velocity deltas)
#   'des_x'=3 'des_y'=4 'des_z'=5 (desired EE position)
geo_constraint_variants:

  # ════════════════════════════════════════════════════════════════════════════
  # TIER 1 — Baseline
  # ════════════════════════════════════════════════════════════════════════════
  # Projector is a no-op.  Use to verify raw FM output and as result denominator.
  # No index: constraint_types: [] has no tunable parameters.
  - name: no_constraint
    constraint_types: []

  # ════════════════════════════════════════════════════════════════════════════
  # TIER 2 — Single-type ablation  (isolate effect of each constraint)
  # ════════════════════════════════════════════════════════════════════════════

  # ── dynamics only ─────────────────────────────────────────────────────────
  # Euler integration link only: c_pos[t+1] = c_pos[t] + act[t].
  # No geometric bounds, no obstacles.  No tunable params → no index.
  - name: dynamics_only
    constraint_types: ['dynamics']

  # ── bounds only ───────────────────────────────────────────────────────────
  # Workspace box on EE position (dims 6-8).  No kinematic link.
  # workspace_bounds + enlarge_constraints are tunable → _1/_2 index.
  - name: bounds_only_1
    constraint_types: ['bounds']
    # workspace_bounds and enlarge_constraints inherited from top-level defaults

  #- name: bounds_only_2           # ← parameter tuning variant; edit values below
  #  constraint_types: ['bounds']
  #  workspace_bounds:
  #    lb: [0.3, -0.35, 0.05]     # ← tune: adjust reach envelope
  #    ub: [0.7,  0.35, 0.40]     # ← tune
  #  enlarge_constraints: 0.01    # ← tune: tightening margin for *-tightened variants

  # ── obstacle only ─────────────────────────────────────────────────────────
  # Sphere exclusion zone only.  Disabled: obstacle geometry not yet measured.
  # obstacle_constraints are tunable (center, radius, dims) → _1/_2 index.
  #
  # Virtual obstacle sits on the direct block-push path (centre of reach envelope),
  # testing DPCC routing around it — analogous to avoiding paper's Table 1.
  #
  # 2D cylinder (x-y plane, same style as avoiding paper — no z constraint):
  #- name: obstacle_only_1
  #  constraint_types: ['obstacles']
  #  obstacle_constraints:
  #    - type: sphere_outside
  #      dimensions: ['x', 'y']   # 2D cylinder projection — avoiding-paper style
  #      center: [0.50, 0.00]     # metres — tune to actual obstacle position
  #      radius: 0.06             # metres — tune to actual obstacle size
  #
  #- name: obstacle_only_2         # ← 3D sphere variant (stricter, more realistic)
  #  constraint_types: ['obstacles']
  #  obstacle_constraints:
  #    - type: sphere_outside
  #      dimensions: ['x', 'y', 'z']   # true 3D sphere
  #      center: [0.50, 0.00, 0.12]    # metres — z ≈ table + block height; tune
  #      radius: 0.06                   # metres — tune

  # ════════════════════════════════════════════════════════════════════════════
  # TIER 3 — Combinations  (numbered slots; define content via constraint_types)
  # ════════════════════════════════════════════════════════════════════════════
  # combined_N are flexible experiment slots.  Change constraint_types (and add
  # obstacle_constraints if needed) to define what each slot tests.
  # Obstacle-involving slots are disabled until obstacle geometry is measured.

  # combined_1: dynamics + obstacle  [disabled — obstacle geometry not ready]
  #- name: combined_1
  #  constraint_types: ['dynamics', 'obstacles']
  #  obstacle_constraints:
  #    - type: sphere_outside
  #      dimensions: ['x', 'y']
  #      center: [0.50, 0.00]
  #      radius: 0.06

  # combined_2: dynamics + bounds  [active — DPCC-equivalent for this task]
  # Closest match to the avoiding paper's full constraint set (minus halfspace/
  # obstacle which have no physical analogue in the aligning workspace).
  - name: combined_2
    constraint_types: ['dynamics', 'bounds']

  # combined_3: dynamics + bounds + obstacle  [disabled — obstacle geometry not ready]
  #- name: combined_3
  #  constraint_types: ['dynamics', 'bounds', 'obstacles']
  #  obstacle_constraints:
  #    - type: sphere_outside
  #      dimensions: ['x', 'y']
  #      center: [0.50, 0.00]
  #      radius: 0.06

# Safety clamp — max physical delta per step (metres). null = disabled.
# 0.01 m ≈ 45× the healthy Gen6V4 step size; stops ODE explosions while
# allowing normal fast-approach actions. Adjust per experiment.
max_action_delta: null # 0.01
