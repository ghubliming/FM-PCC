# General
write_to_file: True
exps: [
  'aligning-d3il-visual',
  'visual_aligning_dpcc',
  'fm_visual_aligning',
]
#seeds: [6, 7, 8, 9, 10]
seeds: [6]


# --- STATE-ONLY PARAMETERS (COMMENTED OUT: NOT NEEDED FOR VISUAL ALIGNING) ---
# avoiding_halfspace_variants: [
#   'top-right-hard',
#   'top-left-hard',
#   'both-hard',
# ] # NOT NEEDED: Aligning task represents open-table manipulation and has no vertical halfspace walls.
#
# n_trials: 2 # NOT NEEDED: Visual aligning uses 'n_contexts' context rollouts (see n_contexts below) for evaluation.
#
# dt: {
#   'avoiding': 1,
# } # NOT IN USE: setup_dpcc_projector() defaults to dt=1.0 (config.get('dt', 1.0)).
#   # dt=1.0 IS CORRECT for this task: actions are position deltas [dx,dy,dz], not
#   # velocity × dt. The Euler dynamics constraint is c_pos[t+1] = c_pos[t] + 1.0 * act[t].
#   # DO NOT set dt=0.1 (the robot controller integration step) — that value belongs to
#   # the physical controller, not to the DPCC trajectory constraint scaling.
#
# observation_indices: {
#   'avoiding': {'x_des': 0, 'y_des': 1, 'x': 2, 'y': 3},
# } # NOT IN USE: Our eval script hardcodes trajectory indices directly in setup_dpcc_projector()
#   # as ('deriv', [6,0]), ('deriv', [7,1]), ('deriv', [8,2]). No YAML lookup needed.
#
# action_indices: {
#   'avoiding': {'vx': 0, 'vy': 1},
# } # NOT IN USE: Same reason — action dims 0-2 are hardcoded in setup_dpcc_projector().
#   # workspace_bounds (below) is the Cartesian safety-limits box, gated by 'geo_bounds' in
#   # constraint_types (Patch_Constraints_C3) — NOT 'bounds'. 'bounds' was restored to DPCC's
#   # true meaning: an action-magnitude limit (see action_bounds below), which this eval had
#   # silently dropped when it repurposed the 'bounds' name for the position box.
# -----------------------------------------------------------------------------

# D3IL simulation parameters
n_contexts: 3
n_trajectories_per_context: 1

# Policy
diffusion_timestep_threshold: 0.5
mpc_foresight_stride: 6          # show every Nth replan decision point in standalone MPC plot (default 6)

# Safety clamp — max physical delta per step (metres). null = disabled.
# 0.01 m ≈ 45× the healthy Gen6V4 step size; stops ODE explosions while
# allowing normal fast-approach actions. Adjust per experiment.
max_action_delta: null # 0.01

# Projection
# Exact DPCC reference variant list (from dpcc/config/projection_eval.yaml).
# Trajectory selection driven by variant name, matching DPCC eval.py exactly:
#   trajectory_selection = 'random'              (default — always index 0, deterministic)
#   if 'dpcc-t' in variant → 'temporal_consistency'
#   if 'dpcc-c' in variant → 'minimum_projection_cost'
# dt0p25/dt0p5/dt2p0/dt4p0 = dynamics constraint dt scale factor
# (tightened versions are auto-generated as {geo_name}-tightened folders by the geo loop)
projection_variants: [
  'diffuser',
  # Figure 2, Table 1 and Figure 3:
  'dpcc-r',
  'dpcc-c',
  'dpcc-t',
  # Table 1:
  'gradient',
  'post_processing',
  'model_free',                # dynamics OFF, rest ON
  # U8 (Gen11E9U8_Sync): constraint-group ablation toggles, composable by substring — REPLACES
  # the geo-level `dynamics_bounds_only`/`action_bounds_only` entries (both removed below).
  'bounds_free',                # action-bound OFF, rest ON
  'geo_free',                   # geo_bounds+halfspace+obstacles OFF, rest ON (dynamics+bounds only)
  'geo_free-bounds_free',       # dynamics ALONE (no bounds, no geometric constraints)
  'geo_free-model_free',        # bounds ALONE (no dynamics, no geometric constraints)
  'model_free-bounds_free',     # geometry ALONE (no dynamics, no action bound) — U8b: missing
                                #   3rd of the "X alone" trilogy; mirrors the UAV add (see
                                #   Gen11 Epoch9 U_8 CHANGELOG_U8b_add_geometry_alone_variant.md)
  # Table 2: dynamics dt scale sweep — tightened sibling auto-generated by geo loop
  'dpcc-c-dt0p25',
  'dpcc-c-dt0p5',
  'dpcc-c-dt2p0',
  'dpcc-c-dt4p0',
]

# --- STATE-ONLY PROJECTION BASES (COMMENTED OUT: NOT NEEDED FOR VISUAL ALIGNING) ---
# projection_cost: 'pos_vel' # NOT NEEDED: Visual aligning cost is optimized directly on the 6D states and actions.
#
# halfspace_constraints: {
#   'avoiding-d3il': [
#     [[0.8, -0.5], [0.4, 0.5], 'below'],
#     [[0.2, -0.5], [0.6, 0.5], 'below'],
#   ],
# } # NOT NEEDED: Aligning workspace has no simulated halfspace obstacles.
#
# obstacle_constraints: {
#   'avoiding-d3il': [
#     {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, 0.08], 'radius': 0.06},
#   ]
# } # NOT NEEDED: Aligning workspace has no simulated spherical obstacles.
#
# bounds: {
#   'avoiding-d3il': [
#     {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.01, 0]},
#   ],
# } # Patch_Constraints_C3: this avoiding-task action-magnitude bound is NOT superseded by
#   # 'workspace_bounds' (that's an orthogonal Cartesian POSITION box, gated by 'geo_bounds').
#   # RESTORED below as `action_bounds` — self-derived from this dataset's own action range
#   # by default ('auto'), not copied from avoiding's hardcoded ['vx','vy'] values (wrong
#   # scale/robot/speed for this task — see action_bounds comment below).
#
# plot_how_many: 10
# ax_limits: {
#   'avoiding-d3il': [[0.2, 0.8], [-0.3, 0.4]]
# } # NOT NEEDED: Handled visually via 3D MuJoCo rendering and Tee log interceptors instead of 2D matplotlib axes.
# ---------------------------------------------------------------------------------

# ══════════════════════════════════════════════════════════════════════════════
# GEOMETRIC CONSTRAINT PARAMETERS
# All constraint-related settings are grouped here at the end.
# ══════════════════════════════════════════════════════════════════════════════

# enlarge_constraints: tightening margin δ (metres) for the auto-generated tightened twin.
#
#   PLANNING (projector) — uses δ, makes constraints HARDER:
#     Geo bounds: ws_lb += δ, ws_ub -= δ    → smaller workspace box
#     Obstacles:  radius += δ               → larger exclusion sphere
#     Halfspace:  boundary shifts +δ·n inward → less usable xy area
#     Dynamics:   unchanged (equality constraint, no boundary to move)
#     Action bounds ('bounds'): UNCHANGED by δ — it's a dataset-range action-magnitude
#       cap, not a spatial surface, so tightening doesn't apply to it (Patch_Constraints_C3).
#
#   EXECUTION METRICS — always checked against NOMINAL (δ=0) for all variants.
#     This matches the original DPCC paper convention so that nominal vs tightened
#     results are directly comparable.  Expected outcome: tightened shows BETTER
#     exec_constraint_sat_rate because its trajectories stay δ inside the nominal
#     boundary, absorbing execution noise up to δ metres.
#
#   Non-null → geo loop auto-generates a '{geo_name}-tightened' sibling run for every
#   active geo entry whose constraint_types includes 'geo_bounds', 'obstacles', or 'halfspace'.
#   dynamics_only-style / no_constraint entries (no such families declared) are unaffected.
#   null → tightening disabled; no -tightened folders are created.
#   NOTE (U8): the `-free` projection_variant toggles (geo_free/bounds_free) can make a
#   `-tightened` sibling a no-op even when this check says "has spatial families" — e.g.
#   'geo_free-tightened' tightens nothing, since geo_free already removed everything
#   tightening would touch. Harmless (identical result to non-tightened), just wasted compute
#   if you sweep every `-tightened` variant blindly.
enlarge_constraints: 0.03

# ── Action-magnitude bound (Patch_Constraints_C3) ─────────────────────────────
# RESTORED DPCC 'bounds' semantics — a limit on the ACTION dims (0,1,2 = dx,dy,dz), distinct
# from the Cartesian position box ('geo_bounds'/`workspace_bounds` below). DPCC-avoiding had
# this (hardcoded on ['vx','vy']); this eval had silently dropped it when 'bounds' got
# repurposed for the position box (see Patch_Constraints_C3/PROBLEM_bounds_velocity_vs_geo.md).
#   'auto' (DEFAULT, RECOMMENDED) — self-derives lb/ub from act_normalizer.mins/.maxs (this
#     dataset's own observed action range, fit at eval load time). Copying avoiding's NUMBER
#     would be wrong (different robot/scale/speed); 'auto' reuses the SAME METHOD instead.
#   {lb: [.,.,.], ub: [.,.,.]} — explicit override.
#   null — disables the action-magnitude bound entirely.
action_bounds: 'auto'

# ── Which geo entries to run ──────────────────────────────────────────────────
# Change this list to select which named entries from geo_constraint_variants below
# are actually executed. No commenting/uncommenting entries needed.
# null → run all defined entries.
#
# All available entries (defined below — add any to the list to run it):
#   no_constraint
#   geo_bounds_only_1 | geo_bounds_only_2   (renamed from bounds_only_1/2, Patch_Constraints_C3
#                                            — these ablate the POSITION box at 2 DIFFERENT
#                                            geometries (2D/3D box), not just family on/off —
#                                            kept; not replaceable by a projection_variant toggle)
#   obstacle_only_1 | obstacle_only_2   ← PLACEHOLDER geometry, tune before real use
#   halfspace_only_1
#   combined_1 | combined_2 | combined_3 | combined_4 | combined_5
#   (halfspace_only_2 stays commented — 3D halfspace format not yet implemented in code)
#
# U8 (Gen11E9U8_Sync): `dynamics_only`/`dynamics_bounds_only`/`action_bounds_only` REMOVED —
# use combined_5 + a `projection_variants` toggle instead (`model_free`/`bounds_free`/
# `geo_free`, composable — see projection_variants list above for the full set).
#
#active_geo_variants: [no_constraint, combined_4]
active_geo_variants: [combined_5]


# ── Geo constraint sweep ────────────────────────────────────────────────────────
# Outer loop: each entry runs the full projection_variants sweep under a different
# geometric constraint configuration, producing results/{name}/{variant}/ subtrees.
#
# Naming scheme:
#   no index   — no tunable geometric parameters (no_constraint)
#   _1 / _2    — distinct parameter sets for single-type configs; _1 and _2 have
#                DIFFERENT values so running both gives a meaningful comparison.
#                _1 = conservative/tighter  _2 = relaxed/wider
#   combined_N — numbered combination slots; content defined by constraint_types
#
# Named dims for obstacle_constraints (mapped to 9D trajectory indices in code):
#   'x'=6  'y'=7  'z'=8      EE Cartesian position (metres)
#   'dx'=0 'dy'=1 'dz'=2     action / velocity deltas
#   'des_x'=3 'des_y'=4 'des_z'=5   desired EE position
geo_constraint_variants:

  # ════════════════════════════════════════════════════════════════════════════
  # TIER 1 — Baseline
  # ════════════════════════════════════════════════════════════════════════════
  # Projector is a no-op: raw FM output, no geometric enforcement.
  # Use as result denominator and sanity check.
  # No index: constraint_types: [] has no tunable parameters.
  - name: no_constraint
    constraint_types: []

  # ════════════════════════════════════════════════════════════════════════════
  # TIER 2 — Single-type ablation  (isolate effect of each constraint type)
  # ════════════════════════════════════════════════════════════════════════════

  # ── dynamics / dynamics+bounds / bounds-alone — REMOVED (U8, Gen11E9U8_Sync) ──────
  # `dynamics_only`, `dynamics_bounds_only`, and `action_bounds_only` used to live here as
  # separate geo entries. All three are now fully redundant: they're expressible as
  # `projection_variants` toggles on the ONE full-stack `combined_5` entry —
  #   dynamics_only        → combined_5 + variant 'geo_free-bounds_free'
  #   dynamics_bounds_only → combined_5 + variant 'geo_free'
  #   action_bounds_only   → combined_5 + variant 'geo_free-model_free'
  # See the truth table in Gen11E9U8_Sync's changelog. Removed rather than left as unused
  # dead weight, per the same "ablate via variant, not via geo entry" simplification applied
  # to config/uav_projection.yaml.
  #
  # ── geo bounds only (renamed from bounds_only_1/2, Patch_Constraints_C3) ──────
  # Workspace box on EE position (dims 6-8).  No kinematic link.
  # 2D vs 3D: '2D' means only x-y are bounded; z = -.inf/+.inf (unconstrained).
  #           '3D' extends the box to include z (floor + ceiling).
  #           2D is just 3D with z = ±∞ — code handles inf values correctly.
  # _1 = 2D (x-y only) — simpler ablation; z unconstrained.
  # _2 = 3D (x-y-z box) — adds floor/ceiling constraint; both entries are defined and selectable.
  #
  # workspace_bounds: Physical Franka EE Cartesian limits in metres.
  #   x=forward (from robot base), y=lateral (left/right), z=vertical.
  #   Franka panda table-top aligning task geometry:
  #     x: 0.30–0.70 m — forward reach; table starts ~0.30 m from base
  #     y: -0.35–0.35 m — covers full block travel lane
  #     z: 0.05–0.40 m — 0.05 m floor prevents table collision;
  #                       0.40 m ceiling stops upward EE escape during push
  #   Effect: DPCC projector clips c_pos waypoints (dims 6-8) to this box.
  #   If projection is too aggressive (robot stalls), widen lb/ub or disable 'geo_bounds'.
  - name: geo_bounds_only_1
    constraint_types: ['geo_bounds']
    workspace_bounds:
      lb: [0.30, -0.35,  -.inf]  # 2D: x-y constrained, z unconstrained
      ub: [0.70,  0.35,   .inf]

  - name: geo_bounds_only_2
    constraint_types: ['geo_bounds']
    workspace_bounds:
      lb: [0.30, -0.35, 0.05]   # 3D: x-y-z all constrained (floor=0.05, ceiling=0.40)
      ub: [0.70,  0.35, 0.40]

  # ── obstacle only ─────────────────────────────────────────────────────────
  # Sphere exclusion zone only, no other constraints.
  # _1 = 2D cylinder (x-y plane, avoiding-paper style — no z constraint).
  # _2 = 3D sphere (stricter, true volumetric exclusion).
  # NOTE: center/radius are placeholder values — tune to measured scene geometry.
  - name: obstacle_only_1
    constraint_types: ['obstacles']
    obstacle_constraints:
      - type: sphere_outside
        dimensions: ['x', 'y']       # 2D cylinder projection — avoiding-paper style
        center: [0.50, 0.00]         # metres — PLACEHOLDER: tune to actual obstacle position
        radius: 0.06                 # metres — PLACEHOLDER: tune to actual obstacle size

  - name: obstacle_only_2
    constraint_types: ['obstacles']
    obstacle_constraints:
      - type: sphere_outside
        dimensions: ['x', 'y', 'z']  # true 3D sphere — stricter
        center: [0.50, 0.00, 0.12]   # metres — PLACEHOLDER: z ≈ table surface + block height
        radius: 0.08                 # metres — PLACEHOLDER: slightly larger for z coverage

  # ── halfspace only ────────────────────────────────────────────────────────
  # Oriented linear inequality constraints in the EE horizontal plane (x-y).
  # Distinct from bounds: bounds are axis-aligned (x>=lb, x<=ub); halfspace allows
  # OBLIQUE planes at any angle — "stay to one side of a diagonal line".
  # Tightening: shifts the constraint boundary inward by enlarge_constraints.
  # Format: [[x1,y1], [x2,y2], 'above'/'below']  (metres; x=forward, y=lateral)
  #   Line defined by two 2D EE position points; 'above'/'below' = feasible side.
  # 2D vs 3D: 2D operates only in x-y plane (z unconstrained).
  #           3D requires a full plane normal — different yaml format, PENDING impl.
  # _1 = 2D halfspace — defined; selectable for debugging (verifies halfspace code path)
  # _2 = 3D halfspace — commented, pending implementation
  - name: halfspace_only_1
    constraint_types: ['halfspace']
    halfspace_constraints:
      - [[0.30, -0.05], [0.70, 0.05], 'above']  # gentle slope: y≈-0.05→0.05 across full x
      #   EE must stay 'above' this line (positive-y side).  Nearly horizontal — moderate
      #   constraint that keeps EE in the upper ~60% of the y workspace.

  #- name: halfspace_only_2
  #  # 3D halfspace — PENDING IMPLEMENTATION
  #  # Requires different yaml format: plane normal vector + offset (not two-point line).
  #  # Code does NOT yet support this format; add it before enabling.
  #  constraint_types: ['halfspace']
  #  halfspace_constraints:
  #    - normal: [0.0, 1.0, -0.5]   # example: tilted plane with y and z components
  #      offset: 0.10               # n · [x,y,z]_ee <= offset
  #      type: '3d'                 # flag to select 3D code path (not yet implemented)

  # ════════════════════════════════════════════════════════════════════════════
  # TIER 3 — Combinations  (numbered slots; define content via constraint_types)
  # ════════════════════════════════════════════════════════════════════════════
  # combined_N are flexible experiment slots — change constraint_types (and add
  # obstacle_constraints if needed) without renaming, so output folders are stable.
  # Obstacle-involving slots use PLACEHOLDER geometry until real obstacle positions are measured.

  # combined_1: dynamics + obstacle  [PLACEHOLDER obstacle geometry — tune before real use]
  - name: combined_1
    constraint_types: ['dynamics', 'obstacles']
    obstacle_constraints:
      - type: sphere_outside
        dimensions: ['x', 'y']
        center: [0.50, 0.00]   # PLACEHOLDER
        radius: 0.06           # PLACEHOLDER

  # combined_2: dynamics + geo_bounds  [defined; not currently active — see active_geo_variants]
  # Uses 3D geo bounds (x-y-z all constrained) intentionally — the combination config
  # is the full physical model; ablation (geo_bounds_only_1) uses 2D.
  # (renamed 'bounds'→'geo_bounds', Patch_Constraints_C3 — this entry never claimed to be the
  # full DPCC set, so no action-bounds restoration needed here.)
  - name: combined_2
    constraint_types: ['dynamics', 'geo_bounds']
    workspace_bounds:
      lb: [0.30, -0.35, 0.05]   # 3D: floor=0.05 prevents table collision
      ub: [0.70,  0.35, 0.40]   # 3D: ceiling=0.40 stops upward EE escape

  # combined_3: dynamics + geo_bounds + obstacle  [PLACEHOLDER obstacle geometry — tune before real use]
  # (renamed 'bounds'→'geo_bounds', Patch_Constraints_C3)
  - name: combined_3
    constraint_types: ['dynamics', 'geo_bounds', 'obstacles']
    workspace_bounds:
      lb: [0.30, -0.35, 0.05]
      ub: [0.70,  0.35, 0.40]
    obstacle_constraints:
      - type: sphere_outside
        dimensions: ['x', 'y']
        center: [0.50, 0.00]   # PLACEHOLDER
        radius: 0.06           # PLACEHOLDER

  # combined_4: dynamics + geo_bounds + halfspace + obstacles + bounds  [defined; not currently
  # active — see active_geo_variants]
  # Full DPCC constraint set (matches avoiding paper: ['halfspace','obstacles','dynamics','bounds']).
  # Patch_Constraints_C3: 'bounds' RESTORED alongside the renamed 'geo_bounds' — this entry
  # claims to be the full DPCC set, so it must carry the action-magnitude limit DPCC actually
  # had (self-derived via `action_bounds: 'auto'`, not the position box alone).
  # Uses RELAXED geo_bounds and halfspace for debug/test (UF-16.1); obstacle geometry is still
  # PLACEHOLDER. Swap to nominal bounds/halfspace once scene geometry is confirmed (commented
  # originals below).
  - name: combined_4
    constraint_types: ['dynamics', 'geo_bounds', 'halfspace', 'obstacles', 'bounds']
    # ── geo_bounds: relaxed for test purpose (wider box, more room for EE) ─────
    workspace_bounds:
      lb: [0.20, -0.45, 0.02]   # relaxed: ±0.10 wider in x, ±0.10 wider in y, z floor lowered
      ub: [0.80,  0.45, 0.50]   # relaxed: ceiling raised to 0.50
    # Original (nominal scene bounds — re-enable once scene geometry confirmed):
    #   lb: [0.30, -0.35, 0.05]
    #   ub: [0.70,  0.35, 0.40]
    # ── halfspace: relaxed for test purpose (line near workspace edge) ─────────
    halfspace_constraints:
      - [[0.20, -0.38], [0.80, -0.30], 'above']   # relaxed: line near lower-y edge; only ~0.08 m strip forbidden
    # Original (moderate slope, cuts ~half the y-range):
    #   - [[0.30, -0.05], [0.70, 0.05], 'above']   # gentle slope: y≈-0.05→0.05 across full x; tune to scene
    obstacle_constraints:
      - type: sphere_outside
        dimensions: ['x', 'y']
        center: [0.50, 0.00]   # tune to measured obstacle position
        radius: 0.06

  # combined_5: dynamics + geo_bounds + halfspace + obstacles + bounds  [CURRENTLY ACTIVE — see
  # active_geo_variants]
  # Same constraint set as combined_4 but with a '\'-shaped halfspace on the right side of the workspace.
  # The halfspace line (top-left → bottom-right) cuts off the upper-right region, keeping the EE
  # to the left/lower side — simulates a diagonal wall on the right.
  # Geo bounds and obstacle geometry identical to combined_4 (relaxed bounds, PLACEHOLDER obstacle).
  # Patch_Constraints_C3: 'bounds' RESTORED here too (this is the CURRENTLY ACTIVE entry) — the
  # action-magnitude guard DPCC had is back, self-derived via `action_bounds: 'auto'` above.
  - name: combined_5
    constraint_types: ['dynamics', 'geo_bounds', 'halfspace', 'obstacles', 'bounds']
    # ── geo_bounds: kept identical to combined_4 ───────────────────────────────
    workspace_bounds:
      lb: [0.20, -0.45, 0.02]
      ub: [0.80,  0.45, 0.50]
    # ── halfspace: '\' shaped line on the right side ───────────────────────────
    halfspace_constraints:
      # Line goes from top-left (0.65, 0.45) to bottom-right (0.80, -0.45), creating a '\' shape.
      # 'below' means the safe zone is to the left/bottom of this line (cuts off top-right).
      - [[0.65, 0.45], [0.80, -0.45], 'below']
    # ── obstacles: kept identical to combined_4 ────────────────────────────────
    obstacle_constraints:
      - type: sphere_outside
        dimensions: ['x', 'y']
        center: [0.50, 0.00]
        radius: 0.06



# ══════════════════════════════════════════════════════════════════════════════
# Gen14 U7 — HardFlow (`hardflow_new`) arm C
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 This file is SHARED with the Gen6V4 and Gen7 evals, neither of which has HardFlow
# code. Both keys below are read ONLY by mix_visual_aligning_test/eval_mix_visual_aligning.py;
# every other consumer ignores them (an unknown top-level key is inert in all of them).
#
# ⚠️ NEVER put 'hardflow_new-*' into `projection_variants` above — that list IS shared, and
# injecting arm C there would crash Gen6V4/Gen7. Same trap
# `config/meanflow_projection_eval.yaml:6` documents.

# Opt-in arm-C variant list, APPENDED to projection_variants by the Gen14 eval only.
# Empty = HardFlow off (the default; every existing run reproduces byte-for-byte).
# Selection suffix mirrors DPCC's, so hardflow_new-c is the matched partner of dpcc-c:
#   hardflow_new-r  -> random (index 0)      hardflow_new-t -> temporal_consistency
#   hardflow_new-c  -> minimum_projection_cost
#
# ⚠️ Do NOT append '-tightened' here. In Gen14 tightening is a GEO-level flag — the
# '<geo>-tightened' twin is auto-generated for every entry with spatial families and every
# variant is run under both — unlike Gen3v6/v7 where '-tightened' is part of the variant
# name. Adding the suffix would create a variant that is never tightened and whose selection
# suffix no longer parses.
# Env override for a one-off sweep: HFFM_VARIANTS="hardflow_new-r hardflow_new-c"
#
# HOSTS: fm / mf / af only. The `diffusion` arm is a DDPM reverse chain with no velocity
# field, so `hardflow_new` — which integrates v = f(x, t) outside the solver — is undefined
# on it; the eval skips those cells with an explicit message rather than crashing.
hardflow_variants: []
# hardflow_variants: ['hardflow_new-r', 'hardflow_new-c', 'hardflow_new-t']

hardflow:
  # 'deriv'      -> reuse FMPCC's own Euler kinematics constraints, so arms B and C
  #                 enforce an IDENTICAL feasible set and differ only in WHEN the
  #                 constraint is applied. This is the matched comparison and the default.
  # 'linear_fit' -> HardFlow-faithful s' = A s + B a + c. Needs a fitted .npz; not wired
  #                 for the visual task yet.
  dynamics_mode: deriv

  # Prox weight on ||x1 - x1_ref||^2. With a pure proximal objective this does not move
  # the argmin (Gen12 gates_hardflow.py::gate_g2); kept faithful to upstream.
  reg_scale: 1.0

  # ── late-activation threshold (Gen3v6 fix_6: DPCC polarity) ──────────────────
  # SAME meaning as diffusion_timestep_threshold above: fraction of the LATE trajectory
  # over which the NLP is active — HIGHER = MORE projection. Solved when
  # tau_next >= (1 - threshold); the FINAL step is ALWAYS solved (the terminal solve is
  # what the safety guarantee rides on). Env override: HFFM_ACT_THRESHOLD.
  #   1.0 -> every step        0.5 -> last half        0.0 -> terminal-only
  # Default here is `null` = inherit `diffusion_timestep_threshold` (0.5), so arms B and C
  # project over the same fraction of the ODE unless you deliberately break the match.
  #
  # ⚠️ At K=2 this knob has almost no resolution: int((1-T)*2) is 1 for T in (0, 0.5] and
  # 0 for T > 0.5, so 0.5 and 0.0 give the same single terminal solve. See Gen14 U5 DA §12.1.
  activation_threshold: null

  # Solver chatter. Gen13 hit console spam three times; these are SEPARATE switches and
  # silencing only the first is what went wrong before.
  ipopt_print_level: 0
  casadi_print_time: False
