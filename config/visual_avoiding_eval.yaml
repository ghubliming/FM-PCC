# Visual Avoiding Eval Config — Gen9 Epoch 2 (REWRITTEN, U4 fix_2)
#
# Visual avoiding == state avoiding run on PIXELS. The workspace, obstacles, half-spaces,
# bounds and dims are IDENTICAL to state avoiding — the only difference (camera vs state
# observation) comes from the MODEL, which the eval scripts supply via the Parser
# (config.avoiding-d3il-visual). So this eval config is a faithful mirror of
# config/projection_eval.yaml (the avoiding geometry), with its OWN seed list so visual
# avoiding can be tuned independently of the 41 scripts that share projection_eval.yaml.
#
# Read by (active): diffuser_visual_avoiding_test/eval_visual_avoiding_dpcc.py
#                   fm_visual_avoiding_test/eval_fm_visual_avoiding.py
# The previous content (geo_constraint_variants / n_contexts / aligning-style keys) was a
# wrong clone from the visual-ALIGNING eval and did not match the active scripts' schema.

# General
write_to_file: True
exps: [
  'avoiding-d3il',         # constraint/geometry key; visual model supplied by the Parser
  ]
seeds: [6,7,8,9,10]        # visual-avoiding's own seed list (independent of projection_eval.yaml)

avoiding_halfspace_variants: [
  'top-right-hard',    # /
  'top-left-hard',     # \
  'both-hard',         # / and \
  ]
n_trials: 2

dt: {
  'avoiding': 1,    # a = [delta_x, delta_y] (not [vx, vy])
}
observation_indices: {
  'avoiding': {'x_des': 0, 'y_des': 1, 'x': 2, 'y': 3},
}
action_indices: {
  'avoiding': {'vx': 0, 'vy': 1},
}

# Policy
diffusion_timestep_threshold: 0.5

# Projection
projection_variants: [
  'dpcc-r',
  'dpcc-r-tightened',
  'dpcc-c',
  'dpcc-c-tightened',
  'dpcc-t',
  'dpcc-t-tightened',
  'diffuser',
  'gradient',
  'gradient-tightened',
  'post_processing',
  'post_processing-tightened',
  'model_free',
  'model_free-tightened',
  'dpcc-c-tightened-dt0p25',
  'dpcc-c-tightened-dt0p5',
  'dpcc-c-tightened-dt2p0',
  'dpcc-c-tightened-dt4p0',
]
projection_cost: 'pos_vel'
constraint_types: [
  'halfspace',
  'obstacles',
  'dynamics',
  'bounds',
  ]
enlarge_constraints: {
  'avoiding': 0.025,
}
halfspace_constraints: {
  'avoiding-d3il': [
    [[0.8, -0.5], [0.4, 0.5], 'below'],     # hard (\ shape)
    [[0.2, -0.5], [0.6, 0.5], 'below'],     # hard (/ shape)
    [[0.8, -0.3], [0.575, 0.5], 'below'],   # easier (\ shape)
    [[0.2, -0.3], [0.425, 0.5], 'below'],   # easier (/ shape)
    ],
}
obstacle_constraints: {
  'avoiding-d3il': [
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, 0.08], 'radius': 0.06},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, 0.08], 'radius': 0.06},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.5, -0.1], 'radius': 0.06},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, 0.08], 'radius': 0.08},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, 0.08], 'radius': 0.08},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.5, -0.09], 'radius': 0.08},
  ]
}
bounds: {   # within dataset limits due to normalization
  'avoiding-d3il': [
    {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.01, 0]},
    {'type': 'upper', 'dimensions': ['vx', 'vy'], 'values': [0.01, 0.01]},
    {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.012, 0]},
    {'type': 'upper', 'dimensions': ['vx', 'vy'], 'values': [0.012, 0.012]},
  ],
}

# Plotting
plot_how_many: 10
ax_limits: {
  'avoiding-d3il': [[0.2, 0.8], [-0.3, 0.4]]
}
