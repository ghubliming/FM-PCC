# Gen3v6 U3 — UNIFIED MeanFlow evaluation config (DPCC arms + HardFlow arm in ONE file).
#
# This is the SINGLE source of truth for the Gen3v6 (MeanFlow) eval. The Gen3v6 driver reads
# ONLY this file (repointed away from the shared config/projection_eval.yaml). We do NOT edit
# config/projection_eval.yaml because it is read by ~50 files across every generation, so adding
# 'hardflow_new' there would inject arm C into Gen3/Gen7/αFlow/etc. and crash the gens without
# HardFlowPolicy. Keeping one dedicated file per U3's "one unified yaml" decision keeps Gen3v6
# isolated AND single-file.
#
# One run emits BOTH the DPCC arms and the HardFlow arm on the mean-flow checkpoint. The HF arm
# is gated by variant.startswith('hardflow'); a DPCC-only run = list only 'dpcc-*'/'diffuser'
# variants below. Everything outside the `hardflow:` block matches the shared projection_eval.yaml
# so the DPCC arms are the identical experiment as the incumbent.

write_to_file: True
exps: [
  'avoiding-d3il',
  ]
seeds: [6]

#seeds: [6, 7, 8, 9, 10]

# NOTE: `flow_steps` (the HardFlow-arm Euler K) lives in the `plan_fm_v3_meanflow` block in
# config/avoiding-d3il.py, and one --flow-steps / HFFM_FLOW_STEPS override sets K for ALL arms
# (matched-K, PLAN §5). This file holds only the experiment knobs (seeds, arms, constraint
# geometry, arm-C tuning).

avoiding_halfspace_variants: [
  'top-right-hard',    # /
  'top-left-hard',     # \
  'both-hard',         # / and \
  ]
n_trials: 2

dt: {
  'avoiding': 1,    # Since a = [delta_x, delta_y] and not [vx, vy]
}
observation_indices: {
  'avoiding': {'x_des': 0, 'y_des': 1, 'x': 2, 'y': 3},
}

action_indices: {
  'avoiding': {'vx': 0, 'vy': 1},
}

# Policy
diffusion_timestep_threshold: 0.5

# ── H8+8 (U10) receding-horizon cadence ───────────────────────────────────────
# How many actions of each plan are executed before a new plan is generated.
#   1  -> replan every env step, execute action[0]  (DPCC/FM-PCC convention, and
#         every result in this generation to date). THE DEFAULT — do not change
#         it to "fix" a run; it changes what the controller IS.
#   8  -> HardFlow's own setting at H16 (upstream run/eval.py:390-397): plan H
#         steps, execute the first 8, discard the rest, replan.
# Must be < horizon. Env override: MF_REPLAN_STEPS.
# ⚠️ A non-default value auto-tags the results path (FMPCC_RUN_MSG=r<N>) because
# the cadence is not one of the folder-name tokens — without that an r1 and an r8
# run at the same K would overwrite each other.
replan_steps: 1

# The three arms of PLAN §5. Keep them together in one run so K, seeds and env
# resets are shared by construction.
# U4.2: arm C accepts DPCC-parity selection suffixes (only meaningful at batch_size>1):
#   hardflow_new / hardflow_new-r  -> random (index 0)
#   hardflow_new-t                 -> temporal_consistency
#   hardflow_new-c                 -> minimum_projection_cost (least NLP intervention)
# U5: full DPCC-parity naming for arm C — {-r,-c,-t} selection x {'', -tightened}
# geometry, mirroring DPCC's own 6-variant set (dpcc-{r,t,c}[-tightened]). The selection
# suffix (-r random / -c minimum_projection_cost / -t temporal_consistency) is only
# MEANINGFUL at batch_size (mpc) > 1; at mpc==1 all three collapse to the same single
# candidate (HardFlowPolicy._select returns index 0), so running the trio there is just
# redundant compute. '-tightened' adds the same 0.025 margin dpcc-c-tightened gets, so
# arm B vs hardflow_new-c-tightened is matched on the feasible set.
#
# DEFAULT below = the two hardflow arms that are non-redundant at mpc==1:
#   hardflow_new             (untightened baseline; == -r/-c/-t at mpc==1)
#   hardflow_new-c-tightened (tightened; the matched partner of dpcc-c-tightened)
# For an mpc>1 sweep, set batch_size>1 and uncomment the full parity set.
projection_variants: [
  'diffuser',                    # arm A — unguided mean-flow ODE (field-quality floor)
  # ── arm B: DPCC post-hoc projection (the incumbent; same set as projection_eval.yaml) ──
  'dpcc-r', 'dpcc-r-tightened',
  'dpcc-c', 'dpcc-c-tightened', # dpcc-c-tightened doubles as the parity SAFEGUARD vs hardflow_new-c-tightened
  'dpcc-t', 'dpcc-t-tightened',
  # ── arm C: HardFlow in-loop constrained sampling (U3 port; queried at h=0 ⇒ u(x,t,0)=v) ──
  # full DPCC-parity matrix; -r/-c/-t only DIFFER at HFFM_BATCH>1 (at mpc==1 they collapse to
  # index 0). '-tightened' adds the same 0.025 margin dpcc-c-tightened gets → matched feasible set.
  'hardflow_new-r', 'hardflow_new-c', 'hardflow_new-t',
  'hardflow_new-r-tightened', 'hardflow_new-c-tightened', 'hardflow_new-t-tightened',
]

projection_cost: 'pos_vel'
constraint_types: [
  'halfspace',
  'obstacles',
  'dynamics',
  'bounds',
  ]

# ── arm C only ────────────────────────────────────────────────────────────────
hardflow:
  # ── B4_PARITY (2026-08-20) — 🔴 P0 FIX: was 1, is now 4 ────────────────────────
  # THE CANDIDATE FAN FOR ARM C. Must match the DPCC arms' `batch_size` in
  # config/avoiding-d3il.py (4), because BOTH arms loop serially over candidates around
  # their CPU solve — DPCC `Projector.project` (`for i in range(batch_size)`, scipy SLSQP)
  # and HardFlow `HardFlowSampler.sample` (`for b in range(batch_size)`, IPOPT). A
  # mismatched fan scales projection wall-time almost linearly and makes every
  # arm-B-vs-arm-C timing comparison void.
  #
  # It shipped as 1 against DPCC's 4 and produced the headline artefact that arm C is
  # ~25% CHEAPER than DPCC, when its per-solve cost is in fact ~1.8-2.2x DPCC's. Every
  # result whose folder name carries the `B1` token is on the wrong side of this — see
  # logs_in_develop/Gen3v6_MeanFlow/DA/DA_20260820_HF_lower_avgtime_batchsize_confound.md
  # and logs_in_develop/HF_Batch_Parity/CHANGELOG_20260820_HF_batch_parity.md.
  #
  # The bare `hardflow_new` variant is pinned to 1 REGARDLESS of this value — that name
  # means "faithful upstream batch-1" (upstream asserts batch==1) and is the control arm.
  # Only the selection variants (-r/-c/-t, +/- -tightened) read this number. The rule is
  # `sampling/hardflow_projection.py::resolve_hf_batch_size`.
  #
  # Env override for a one-off sweep: HFFM_BATCH.
  batch_size: 4

  # 'deriv'      -> reuse FMPCC's own Euler kinematics constraints, so arms B and C
  #                 enforce an IDENTICAL feasible set and differ only in WHEN the
  #                 constraint is applied. This is the matched comparison and the
  #                 default.
  # 'linear_fit' -> HardFlow-faithful s' = A s + B a + c. Requires the .npz from
  #                 FM_v3_hardflow_test/fit_dynamics_fmv3.py; loading refuses if the
  #                 normalizer does not match (PLAN §3.1).
  dynamics_mode: deriv
  linear_dynamics_path: null    # null -> logs/<env>/dynamics_gen12/linear_model_H8_mpl150.npz

  # Prox weight on ||x1 - x1_ref||^2. With a pure proximal objective this does not
  # move the argmin (see gates_hardflow.py::gate_g2) — it is kept faithful to
  # upstream and becomes live only if a competing objective term is added.
  reg_scale: 1.0

  # ── U4 late-activation threshold (fix_6: DPCC polarity) ────────────────────
  # SAME meaning as DPCC's diffusion_timestep_threshold: the fraction of the (late)
  # trajectory over which the NLP is active — HIGHER = MORE projection. The NLP is
  # solved when tau_next >= (1 - threshold); the FINAL step is ALWAYS solved (the
  # terminal solve is what the safety guarantee rides on). Env override: HFFM_ACT_THRESHOLD.
  #   1.0 -> every step (full; the safe default, matches old behaviour)
  #   0.5 -> last half (== DPCC diffusion_timestep_threshold 0.5)
  #   0.0 -> terminal-only NLP (~ post-hoc projection of the final sample)
  # 🔴 FIX_9 (2026-08-07): 1.0 -> 0.5, matching this file's top-level
  # diffusion_timestep_threshold so arms B and C are gated alike unless a run says otherwise.
  # Set it per job with HFFM_ACT_THRESHOLD (and DPCC_THRESHOLD for arm B); both land in the
  # results-folder name as the A and T tokens, so sweep values can no longer overwrite each other.
  activation_threshold: 0.5
  # Back-compat alias, used only if activation_threshold is absent: all|late -> 1.0|0.5
  activation: all

  # ── U4.2: candidate-selection ranking key (for hardflow_new-c) ──────────────
  # 'prox'    -> rank by total NLP intervention  Σ||x1_proj - x1_ref||^2 (recommended)
  # 'control' -> rank by control effort  Σ||u_k||
  candidate_cost: prox

  # PLAN §3.5. Gen13 hit console spam THREE times; one log was 91% CasADi timing
  # tables. `ipopt_print_level` and `casadi_print_time` are SEPARATE switches —
  # silencing only the first is what went wrong before.
  ipopt_print_level: 0
  casadi_print_time: False

enlarge_constraints: {
  'avoiding': 0.025,
}
halfspace_constraints: {
  'avoiding-d3il': [
    [[0.8, -0.5], [0.4, 0.5], 'below'],     # hard (\ shape)
    [[0.2, -0.5], [0.6, 0.5], 'below'],     # hard (/ shape)
    [[0.8, -0.3], [0.575, 0.5], 'below'],   # easier (\ shape)
    [[0.2, -0.3], [0.425, 0.5], 'below'],   # easier (/ shape)
    ],
}
obstacle_constraints: {
  'avoiding-d3il': [
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, 0.08], 'radius': 0.06},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, 0.08], 'radius': 0.06},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.5, -0.1], 'radius': 0.06},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, 0.08], 'radius': 0.08},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, 0.08], 'radius': 0.08},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.5, -0.09], 'radius': 0.08},
  ]
}
bounds: {   # need to be within the limits of the dataset due to the normalization
  'avoiding-d3il': [
    {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.01, 0]},
    {'type': 'upper', 'dimensions': ['vx', 'vy'], 'values': [0.01, 0.01]},
    {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.012, 0]},
    {'type': 'upper', 'dimensions': ['vx', 'vy'], 'values': [0.012, 0.012]},
  ],
}

# Plotting
plot_how_many: 10
ax_limits: {
  'avoiding-d3il': [[0.2, 0.8], [-0.3, 0.4]]
}
