# Gen16 — Visual-Mix-ML AVOIDING eval config (4 engines x 3 guidance arms)
#
# Read by: mix_visual_avoiding_test/eval_mix_visual_avoiding.py  (override with --config)
# Config module: config/avoiding-d3il-visual-mix.py
#
# 🔴 THE GEOMETRY BLOCKS BELOW ARE BYTE-IDENTICAL to config/visual_avoiding_eval.yaml (Gen9)
#    and config/meanflow_projection_eval.yaml (Gen3v6): the same half-spaces, obstacles,
#    bounds, dt, indices and axis limits. That is deliberate and load-bearing — it is what
#    makes Gen16's numbers comparable to the state-only avoiding lineage AND to Gen9's
#    single-engine visual avoiding. If you change geometry here, you have forked the task and
#    every cross-generation table becomes invalid.
#
#    Gen16 has its OWN file rather than sharing one so that its variant list and its seeds can
#    move without dragging the ~40 scripts that read the shared configs. Same reason Gen9 got
#    its own file (Gen9 U4 fix_2).
#
# Visual avoiding == state avoiding run on PIXELS. The workspace, obstacles, half-spaces,
# bounds and dims are IDENTICAL to state avoiding; the only difference (camera vs state
# observation) comes from the MODEL, which the eval supplies via the Parser.

# ── General ───────────────────────────────────────────────────────────────────
write_to_file: True
exps: [
  'avoiding-d3il',         # constraint/geometry key; the visual model comes from the Parser
  ]
seeds: [6, 7, 8, 9, 10]    # Gen16's own seed list; --seed / --seeds override per run

avoiding_halfspace_variants: [
  'top-right-hard',    # /
  'top-left-hard',     # \
  'both-hard',         # / and \
  ]
n_trials: 30

dt: {
  'avoiding': 1,    # a = [delta_x, delta_y] (not [vx, vy])
}
observation_indices: {
  # The 4-D obs the env loop builds: [des_xy(2) | c_xy(2)] — the SAME layout
  # ParityAvoidingDataset trains on (mix_visual_avoiding/models/visual_spec.py).
  'avoiding': {'x_des': 0, 'y_des': 1, 'x': 2, 'y': 3},
}
action_indices: {
  'avoiding': {'vx': 0, 'vy': 1},
}

# ── Policy ────────────────────────────────────────────────────────────────────
# Arm B's projection gate: the fraction of the (late) trajectory over which the DPCC
# Projector is active. Env override per job: DPCC_THRESHOLD. Lands in the results-folder
# name as the T token, so sweep values cannot overwrite each other.
diffusion_timestep_threshold: 0.5

# ── Receding-horizon cadence ──────────────────────────────────────────────────
#   1  -> replan every env step, execute action[0]  (the DPCC/FM-PCC convention, and every
#         FM-PCC result to date). THE DEFAULT — do not change it to "fix" a run; it changes
#         what the controller IS.
#   8  -> HardFlow's own setting at H16 (upstream run/eval.py:390-397).
# Must be < horizon. Env override: MIX_REPLAN_STEPS.
# ⚠️ A non-default value auto-tags the results path (FMPCC_RUN_MSG=r<N>) because the cadence
# is not a folder-name token — without that an r1 and an r8 run at the same K collide.
replan_steps: 1

# ── The three guidance arms ───────────────────────────────────────────────────
# Kept in ONE run so K, seeds and env resets are shared by construction.
#
#   A  `diffuser`        unguided sampler — the field-quality floor. No constraint machinery.
#   B  `dpcc-*`          DPCC post-hoc projection inside the sampler loop (the incumbent).
#   C  `hardflow_new*`   HardFlow in-loop constrained sampling.
#
# Selection suffixes (-r random / -c minimum_projection_cost / -t temporal_consistency) are
# only MEANINGFUL at a candidate fan > 1; at fan == 1 all three collapse to index 0.
# '-tightened' adds the same 0.025 margin, so dpcc-c-tightened and hardflow_new-c-tightened
# are matched on the feasible set.
#
# 🔴 ARM C HAS NO HOST ON THE `diffusion` ENGINE — a DDPM reverse chain has no velocity field,
#    so `hardflow_new` is undefined on it. The eval SKIPS those variants with a printed
#    notice rather than crashing, so this one list serves all four engines.
projection_variants: [
  'diffuser',                    # arm A
  # ── arm B: DPCC post-hoc projection ──
  'dpcc-r', 'dpcc-r-tightened',
  'dpcc-c', 'dpcc-c-tightened',  # dpcc-c-tightened is the matched partner of hardflow_new-c-tightened
  'dpcc-t', 'dpcc-t-tightened',
  # ── arm C: HardFlow in-loop constrained sampling (fm/mf/af only) ──
  'hardflow_new-r', 'hardflow_new-c', 'hardflow_new-t',
  'hardflow_new-r-tightened', 'hardflow_new-c-tightened', 'hardflow_new-t-tightened',
]

projection_cost: 'pos_vel'
constraint_types: [
  'halfspace',
  'obstacles',
  'dynamics',
  'bounds',
  ]

# ── arm C only ────────────────────────────────────────────────────────────────
hardflow:
  # 🔴 B4_PARITY — THE CANDIDATE FAN FOR ARM C. Must match the DPCC arms' `mpc_batch_size`
  # in config/avoiding-d3il-visual-mix.py (4), because BOTH arms loop serially over
  # candidates around their CPU solve — DPCC `Projector.project` (scipy SLSQP) and HardFlow
  # `HardFlowSampler.sample` (IPOPT). A mismatched fan scales projection wall-time almost
  # linearly and makes every arm-B-vs-arm-C timing comparison void. It shipped as 1 against
  # DPCC's 4 in Gen3v6 and produced the headline artefact that arm C is ~25% CHEAPER than
  # DPCC, when its per-solve cost is in fact ~1.8-2.2x DPCC's. See
  # logs_in_develop/HF_Batch_Parity/CHANGELOG_20260820_HF_batch_parity.md.
  #
  # The bare `hardflow_new` variant is pinned to 1 REGARDLESS of this value — that name means
  # "faithful upstream batch-1" (upstream asserts batch==1) and is the control arm. Only the
  # selection variants read this number; the rule is
  # `sampling/hardflow_projection.py::resolve_hf_batch_size`.
  #
  # Env override for a one-off sweep: HFFM_BATCH.
  batch_size: 4

  # 'deriv'      -> reuse FMPCC's own Euler kinematics constraints, so arms B and C enforce
  #                 an IDENTICAL feasible set and differ only in WHEN the constraint is
  #                 applied. This is the matched comparison and the default.
  # 'linear_fit' -> HardFlow-faithful s' = A s + B a + c. Requires a fitted .npz; loading
  #                 refuses if the normalizer does not match.
  #                 ⚠️ Gen16 has NO fitted linear model — the .npz must be refit on THIS
  #                 generation's normalizer (the visual-avoiding one). Using another
  #                 generation's file would silently enforce the wrong physics.
  dynamics_mode: deriv
  linear_dynamics_path: null

  # Prox weight on ||x1 - x1_ref||^2. With a pure proximal objective this does not move the
  # argmin — kept faithful to upstream; becomes live only if a competing term is added.
  reg_scale: 1.0

  # Late-activation threshold, SAME meaning as DPCC's diffusion_timestep_threshold: the
  # fraction of the (late) trajectory over which the NLP is active — HIGHER = MORE
  # projection. The NLP is solved when tau_next >= (1 - threshold); the FINAL step is ALWAYS
  # solved (the terminal solve is what the safety guarantee rides on).
  #   1.0 -> every step        0.5 -> last half (== DPCC 0.5)      0.0 -> terminal-only
  # Set to 0.5 to match this file's diffusion_timestep_threshold, so arms B and C are gated
  # alike unless a run says otherwise. Env override: HFFM_ACT_THRESHOLD (lands in the
  # results-folder name as the A token, so sweep values cannot overwrite each other).
  activation_threshold: 0.5
  activation: all   # back-compat alias, used only if activation_threshold is absent

  # Candidate-selection ranking key for `hardflow_new-c`:
  #   'prox'    -> total NLP intervention  Σ||x1_proj - x1_ref||^2 (recommended)
  #   'control' -> control effort  Σ||u_k||
  candidate_cost: prox

  # 🔴 SEPARATE switches. Gen13 hit console spam three times; one log was 91% CasADi timing
  # tables. Silencing only the first is what went wrong before.
  ipopt_print_level: 0
  casadi_print_time: False

# ── Geometry (identical to visual_avoiding_eval.yaml / meanflow_projection_eval.yaml) ──
enlarge_constraints: {
  'avoiding': 0.025,
}
halfspace_constraints: {
  'avoiding-d3il': [
    [[0.8, -0.5], [0.4, 0.5], 'below'],     # hard (\ shape)
    [[0.2, -0.5], [0.6, 0.5], 'below'],     # hard (/ shape)
    [[0.8, -0.3], [0.575, 0.5], 'below'],   # easier (\ shape)
    [[0.2, -0.3], [0.425, 0.5], 'below'],   # easier (/ shape)
    ],
}
obstacle_constraints: {
  'avoiding-d3il': [
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, 0.08], 'radius': 0.06},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, 0.08], 'radius': 0.06},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.5, -0.1], 'radius': 0.06},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, 0.08], 'radius': 0.08},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, 0.08], 'radius': 0.08},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.5, -0.09], 'radius': 0.08},
  ]
}
bounds: {   # within dataset limits due to normalization
  'avoiding-d3il': [
    {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.01, 0]},
    {'type': 'upper', 'dimensions': ['vx', 'vy'], 'values': [0.01, 0.01]},
    {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.012, 0]},
    {'type': 'upper', 'dimensions': ['vx', 'vy'], 'values': [0.012, 0.012]},
  ],
}

# ── Plotting ──────────────────────────────────────────────────────────────────
plot_how_many: 10
ax_limits: {
  'avoiding-d3il': [[0.2, 0.8], [-0.3, 0.4]]
}
