# Gen12 (HardFlow -> FMv3) evaluation config.
#
# A SEPARATE file, not an edit to config/projection_eval.yaml: that file is shared
# by every other generation, and appending 'hardflow_new' to its `projection_variants`
# would silently add an arm to Gen3/Gen3v2/Gen7 runs. Gen12 is additive (PLAN §2).
#
# Everything outside the `hardflow:` block is a verbatim copy of
# config/projection_eval.yaml, so arms A/B are the same experiment as the incumbent.

write_to_file: True
exps: [
  'avoiding-d3il',
  ]
seeds: [6]

#seeds: [6, 7, 8, 9, 10]

# NOTE: `checkpoint_dir` (which model to load) and `flow_steps` (eval K) now live in the
# `plan_fm_v3_hardflow` block in config/avoiding-d3il.py — the single control entry, kept
# there like every other generation's plan block. This file holds only the experiment
# knobs below (seeds, arms, constraint geometry, arm-C tuning).

avoiding_halfspace_variants: [
  'top-right-hard',    # /
  'top-left-hard',     # \
  'both-hard',         # / and \
  ]
n_trials: 2

dt: {
  'avoiding': 1,    # Since a = [delta_x, delta_y] and not [vx, vy]
}
observation_indices: {
  'avoiding': {'x_des': 0, 'y_des': 1, 'x': 2, 'y': 3},
}

action_indices: {
  'avoiding': {'vx': 0, 'vy': 1},
}

# Policy
diffusion_timestep_threshold: 0.5

# The three arms of PLAN §5. Keep them together in one run so K, seeds and env
# resets are shared by construction.
projection_variants: [
  'diffuser',              # arm A — unguided (field quality floor)
  'dpcc-c-tightened',      # arm B — the incumbent post-hoc projection
  'hardflow_new',          # arm C — in-loop constrained sampling (the contribution)
]

projection_cost: 'pos_vel'
constraint_types: [
  'halfspace',
  'obstacles',
  'dynamics',
  'bounds',
  ]

# ── arm C only ────────────────────────────────────────────────────────────────
hardflow:
  # PLAN §3.4, decided explicitly: FAITHFUL BATCH-1 is the headline. Upstream
  # hard-asserts batch_size == 1 (no candidate fan), and batch-1 is also the
  # honest comparison against Gen13's numbers. The sampler DOES generalise —
  # values > 1 solve one independent NLP chain per candidate, so wall time scales
  # linearly — but candidate selection then falls back to index 0, because arm C
  # has no per-candidate projection cost to rank by. Raise this only to answer
  # "does the candidate fan explain arm B's advantage?", and say so in the write-up.
  batch_size: 1

  # 'deriv'      -> reuse FMPCC's own Euler kinematics constraints, so arms B and C
  #                 enforce an IDENTICAL feasible set and differ only in WHEN the
  #                 constraint is applied. This is the matched comparison and the
  #                 default.
  # 'linear_fit' -> HardFlow-faithful s' = A s + B a + c. Requires the .npz from
  #                 FM_v3_hardflow_test/fit_dynamics_fmv3.py; loading refuses if the
  #                 normalizer does not match (PLAN §3.1).
  dynamics_mode: deriv
  linear_dynamics_path: null    # null -> logs/<env>/dynamics_gen12/linear_model_H8_mpl150.npz

  # Prox weight on ||x1 - x1_ref||^2. With a pure proximal objective this does not
  # move the argmin (see gates_hardflow.py::gate_g2) — it is kept faithful to
  # upstream and becomes live only if a competing objective term is added.
  reg_scale: 1.0

  # 'all'  -> project at every ODE step (upstream default, K NLP solves)
  # 'late' -> only the second half of the ODE (K//2 solves, cheaper, less guided)
  activation: all

  # PLAN §3.5. Gen13 hit console spam THREE times; one log was 91% CasADi timing
  # tables. `ipopt_print_level` and `casadi_print_time` are SEPARATE switches —
  # silencing only the first is what went wrong before.
  ipopt_print_level: 0
  casadi_print_time: False

enlarge_constraints: {
  'avoiding': 0.025,
}
halfspace_constraints: {
  'avoiding-d3il': [
    [[0.8, -0.5], [0.4, 0.5], 'below'],     # hard (\ shape)
    [[0.2, -0.5], [0.6, 0.5], 'below'],     # hard (/ shape)
    [[0.8, -0.3], [0.575, 0.5], 'below'],   # easier (\ shape)
    [[0.2, -0.3], [0.425, 0.5], 'below'],   # easier (/ shape)
    ],
}
obstacle_constraints: {
  'avoiding-d3il': [
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, 0.08], 'radius': 0.06},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, 0.08], 'radius': 0.06},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.5, -0.1], 'radius': 0.06},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.4, 0.08], 'radius': 0.08},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.6, 0.08], 'radius': 0.08},
    {'type': 'sphere_outside', 'dimensions': ['x', 'y'], 'center': [0.5, -0.09], 'radius': 0.08},
  ]
}
bounds: {   # need to be within the limits of the dataset due to the normalization
  'avoiding-d3il': [
    {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.01, 0]},
    {'type': 'upper', 'dimensions': ['vx', 'vy'], 'values': [0.01, 0.01]},
    {'type': 'lower', 'dimensions': ['vx', 'vy'], 'values': [-0.012, 0]},
    {'type': 'upper', 'dimensions': ['vx', 'vy'], 'values': [0.012, 0.012]},
  ],
}

# Plotting
plot_how_many: 10
ax_limits: {
  'avoiding-d3il': [[0.2, 0.8], [-0.3, 0.4]]
}
