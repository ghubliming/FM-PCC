defaults:
  - agents: ddpm_encdec_vision
#  - override hydra/launcher: submitit_slurm

agent_name: ddpm_encdec_vision
log_dir: logs/avoiding/

train_data_path: environments/dataset/data/avoiding/all_data/train_files.pkl
eval_data_path:  environments/dataset/data/avoiding/all_data/eval_files.pkl

# insert wandb here
wandb:
  entity: ???
  project: ???

group: avoiding_${agent_name}

hydra:
  run:
    dir: ${log_dir}/runs/${agent_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${log_dir}/sweeps/${agent_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}

seed: 42

# Network
hidden_dim: 128
num_hidden_layers: 4

# transformer
n_layer: 4
n_head: 4
n_embd: 72

# Training
train_batch_size: 64
val_batch_size: 64
num_workers: 4
device: 'cuda'
epoch: 4
eval_every_n_epochs: 2
scale_data: True

# Environment
# obs_dim=4 = [des_x, des_y, c_x, c_y]; the buffer-size default in Avoiding_Img_Dataset
# is 20 (unused indices stay zero). action_dim=2 = [dx, dy]. max_len_data=200 covers
# the longest avoiding episode (~106 steps) with margin.
obs_dim: 4
action_dim: 2
max_len_data: 200
window_size: 8

# Dataset
trainset:
  _target_: environments.dataset.avoiding_dataset.Avoiding_Img_Dataset
  data_directory: ${train_data_path}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  max_len_data: ${max_len_data}
  window_size: ${window_size}

valset:
  _target_: environments.dataset.avoiding_dataset.Avoiding_Img_Dataset
  data_directory: ${eval_data_path}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  max_len_data: ${max_len_data}
  window_size: ${window_size}

# sim during training
train_simulation:
  _target_: simulation.avoiding_sim.Avoiding_Sim
  seed: ${seed}
  device: ${device}
  render: False
  n_cores: 1
  n_contexts: 1
  n_trajectories_per_context: 1
  if_vision: True

# Simulation
simulation:
  _target_: simulation.avoiding_sim.Avoiding_Sim
  seed: ${seed}
  device: ${device}
  render: False
  n_cores: 5
  n_contexts: 60
  n_trajectories_per_context: 8
  if_vision: True
